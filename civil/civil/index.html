<script>/* Motor de contenido: currículo, generadores deterministas y formato */
const CUR={mods:[],subs:{},order:[]};
const NIVELES=['Básico','Aplicación','Intermedio','Avanzado','Reto'];
const POR_NIVEL=12;
let _modActual=null;
function MOD(id,t,bloque,intro,libros,equiv){_modActual={id,t,bloque,intro,libros,equiv,subs:[]};CUR.mods.push(_modActual);}
function SUB(id,d){d.id=id;d.mod=_modActual.id;_modActual.subs.push(id);CUR.subs[id]=d;CUR.order.push(id);}
const PI=Math.PI,sq=Math.sqrt,rad=d=>d*PI/180,sind=d=>Math.sin(rad(d)),cosd=d=>Math.cos(rad(d)),tand=d=>Math.tan(rad(d)),atand=x=>Math.atan(x)*180/PI,G=9.81;
function n(x,s=4){if(!isFinite(x))return String(x);const v=Number(x.toPrecision(s));return String(v);}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function RNG(seed){let a=seed>>>0;const u=()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};
 return{u,
  i:(a0,b,st=1)=>{const k=Math.floor((b-a0)/st+1e-9)+1;return +(a0+st*Math.floor(u()*k)).toFixed(6);},
  p:arr=>arr[Math.floor(u()*arr.length)]};}
const _cache={};
/* Tolerancia estricta donde el 2 % aceptaría respuestas erradas: conteos y cotas */
const TOL={det:[0,0,0,0,0],arm:[0],pol:[0],cpm:[,0,0,0],niv:[.00002,.00002,.00002],ver:[0,0,.00002,,.00002],hor:[,,,.0002]};
function ejercicios(id){if(_cache[id])return _cache[id];const S=CUR.subs[id],out=[],vistos=new Set();
 S.g.forEach((lv,li)=>{const arr=Array.isArray(lv)?lv:[lv];
  for(let k=0;k<POR_NIVEL;k++){const f=arr[k%arr.length];let e=null;
   for(let salt=0;salt<400;salt++){const c=f(RNG(hash(id+'|'+li+'|'+k+'|'+salt)));if(!vistos.has(c.q)){vistos.add(c.q);e=c;break;}}
   if(!e)e=Object.assign(f(RNG(hash(id+li+k))),{dup:true});
   e.lv=li;e.num=out.length+1;const tf=TOL[id]&&TOL[id][li];if(tf!==undefined)e.tol=tf;e.key=id+':'+e.num;out.push(e);}});
 return _cache[id]=out;}
function correcto(e,val){if(val===null||!isFinite(val))return false;const t=e.tol??0.02;return Math.abs(val-e.a)<=Math.max(t*Math.abs(e.a),1e-3);}
/* Mini sintaxis de fórmulas: _{x} ^{x} [[a|b]] √{x} */
function fm(s){if(s==null)return'';let t=String(s),prev;
 do{prev=t;
  t=t.replace(/\[\[([^\[\]|]*)\|([^\[\]|]*)\]\]/g,'<span class="fr"><span>$1</span><span>$2</span></span>');
  t=t.replace(/√\{([^{}]*)\}/g,'√<span class="rad">$1</span>');
  t=t.replace(/_\{([^{}]*)\}/g,'<sub>$1</sub>');
  t=t.replace(/\^\{([^{}]*)\}/g,'<sup>$1</sup>');
 }while(t!==prev);return t;}
/* Texto de lección: ## título, - lista, **negrita**, párrafos con línea en blanco */
function md(s){const out=[];s.trim().split(/\n\s*\n/).forEach(b=>{b=b.trim();
  if(b.startsWith('## ')){const i=b.indexOf('\n');out.push('<h3>'+inl(i<0?b.slice(3):b.slice(3,i))+'</h3>');if(i<0)return;b=b.slice(i+1).trim();}
  if(b.startsWith('- '))out.push('<ul>'+b.split(/\n/).map(l=>'<li>'+inl(l.replace(/^- /,''))+'</li>').join('')+'</ul>');
  else out.push('<p>'+inl(b)+'</p>');});return out.join('');}
function inl(s){return fm(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');}


MOD('m01','Matemática de obra','Bases',
'Antes de calcular una viga necesitas moverte sin miedo entre unidades, ángulos, vectores y sistemas de ecuaciones. Aquí cada herramienta aparece con un problema de obra.',
['Stewart, Cálculo de una variable','Kreyszig, Matemáticas avanzadas para ingeniería','Lay, Álgebra lineal y sus aplicaciones'],
'UNI: Cálculo Diferencial, Álgebra Lineal, Dibujo de Ingeniería. Equivale a los primeros ciclos de cualquier malla.');
SUB('uni',{t:'Unidades y conversiones',
lec:`Un error de unidades puede tumbar un edificio. La regla es simple: **multiplica por fracciones que valen 1**. Si 1 m = 100 cm, entonces 100 cm/1 m vale 1 y puedes usarla para cancelar metros.

En el Perú verás dos sistemas a la vez: las normas de concreto trabajan en **kg/cm²** y **toneladas**, mientras los libros modernos usan **MPa** y **kN**. Debes pasar de uno a otro sin dudar.

## Equivalencias que usarás toda la carrera
- 1 tonelada-fuerza = 1000 kgf ≈ 9.81 kN
- 1 kg/cm² ≈ 0.0981 MPa, y 1 MPa ≈ 10.2 kg/cm²
- 1 m² = 10 000 cm², así que al pasar áreas el factor se eleva al cuadrado
- Concreto armado: 2400 kg/m³. Agua: 1000 kg/m³

**Hábito de ingeniero:** antes de confiar en un resultado, pregúntate si tiene sentido. Una zapata con 200 kg/cm² sobre el suelo es imposible; el suelo de Lima resiste cerca de 4 kg/cm².`,
key:['1 kg/cm^{2} = 0.0981 MPa','1 t = 9.81 kN','1 m^{2} = 10^{4} cm^{2}'],
err:'Convertir longitudes bien pero olvidar elevar el factor en áreas y volúmenes: 1 m³ son 1 000 000 cm³, no 100 cm³.',
x:[['car','Toda carga de la norma E.020 se convierte a kg/m² o kN/m²'],['fle','El diseño de vigas mezcla kg/cm², cm y t·m']],
g:[
r=>{const fc=r.i(140,700,5);const a=fc*0.0981;return{q:`Un concreto tiene f'_{c} = ${fc} kg/cm². Exprésalo en MPa.`,a,u:'MPa',s:[`Usa el factor: 1 kg/cm² = 0.0981 MPa`,`${fc} × 0.0981 = ${n(a)} MPa`]};},
r=>{const q=r.i(1,12,0.25);const a=q*1000/9.81;return{q:`Una sobrecarga vale ${q} kN/m². ¿Cuántos kg/m² son?`,a,u:'kg/m²',s:[`1 kN = 1000/9.81 kgf = 101.9 kgf`,`${q} × 101.9 = ${n(a)} kg/m²`]};},
r=>{const L=r.i(4,15,.5),B=r.i(3,10,.5),e=r.p([.15,.17,.2,.25]);const V=L*B*e,a=V*2.4;return{q:`Una losa maciza mide ${L} m × ${B} m × ${e*100} cm de espesor. ¿Cuánto pesa? (concreto armado 2.4 t/m³)`,a,u:'t',s:[`Pasa el espesor a metros: ${e} m`,`Volumen = ${L} × ${B} × ${e} = ${n(V)} m³`,`Peso = ${n(V)} × 2.4 = ${n(a)} t`]};},
r=>{const P=r.i(40,300,5),B=r.i(1.2,3.5,.1);const a=P*1000/(B*B*1e4);return{q:`Una columna transmite ${P} t a una zapata cuadrada de ${B} m de lado. Calcula la presión sobre el suelo.`,a,u:'kg/cm²',s:[`Fuerza: ${P} t = ${P*1000} kg`,`Área: (${B*100} cm)² = ${n(B*B*1e4,6)} cm²`,`q = P/A = ${n(a)} kg/cm²`]};},
r=>{const L=r.i(6,20,1),B=r.i(4,10,.5),e=r.p([.1,.15,.2]),c=r.p([300,340,380,420]);const V=L*B*e,a=V*c/42.5;return{q:`Se vaciará un piso de ${L} m × ${B} m y ${e*100} cm de espesor con una mezcla de ${c} kg de cemento por m³. ¿Cuántas bolsas de 42.5 kg se necesitan (sin desperdicio)?`,a,u:'bolsas',s:[`Volumen = ${n(V)} m³`,`Cemento = ${n(V)} × ${c} = ${n(V*c)} kg`,`Bolsas = ${n(V*c)} / 42.5 = ${n(a)}`]};}
]});
SUB('tri',{t:'Trigonometría y triángulos',
lec:`Topografía, armaduras, taludes y fuerzas inclinadas usan lo mismo: un triángulo. Con un ángulo y un lado conoces todo el triángulo rectángulo.

## Las tres razones
- Seno = opuesto / hipotenusa
- Coseno = adyacente / hipotenusa
- Tangente = opuesto / adyacente

La pendiente es una tangente disfrazada: un 8 % significa que subes 8 m por cada 100 m horizontales. Para triángulos sin ángulo recto usa la **ley de senos** o la **ley de cosenos**.

**Imagen mental:** una escalera apoyada en una pared. La pared es el cateto opuesto, el piso el adyacente, la escalera la hipotenusa.`,
key:['sen θ = [[op|hip]], cos θ = [[ady|hip]], tan θ = [[op|ady]]','c^{2} = a^{2} + b^{2} − 2ab·cos C','[[a|sen A]] = [[b|sen B]]'],fig:'triangulo',
err:'Calculadora en radianes. Si sen 30° no te da 0.5, cambia a modo DEG.',
x:[['par','Descomponer fuerzas es usar seno y coseno'],['pol','Las poligonales son triángulos encadenados'],['tal','El ángulo de un talud gobierna su estabilidad']],
g:[
r=>{const h=r.i(3,40,.5),t=r.i(15,70,5);const a=h/tand(t);return{q:`Un talud de ${h} m de altura forma ${t}° con la horizontal. ¿Cuánto mide su proyección horizontal?`,a,u:'m',s:[`tan θ = h / x, entonces x = h / tan θ`,`x = ${h} / tan ${t}° = ${n(a)} m`]};},
r=>{const p=r.i(2,12,.5),L=r.i(50,500,10);const a=p/100*L;return{q:`Una vía tiene pendiente de ${p} % a lo largo de ${L} m horizontales. ¿Cuánto sube?`,a,u:'m',s:[`Pendiente = desnivel / horizontal`,`Δh = ${p/100} × ${L} = ${n(a)} m`]};},
r=>{const d=r.i(20,120,5),t=r.i(10,50,1),e=r.p([1.5,1.6,1.7]);const a=d*tand(t)+e;return{q:`Desde un teodolito a ${e} m de altura, a ${d} m de un edificio, se mide ${t}° hasta su azotea. ¿Qué altura tiene el edificio?`,a,u:'m',s:[`Altura sobre el instrumento = ${d} × tan ${t}° = ${n(a-e)} m`,`Total = ${n(a-e)} + ${e} = ${n(a)} m`]};},
r=>{const A=r.i(40,120,5),b=r.i(30,120,5),c=r.i(40,160,5);const a=sq(b*b+c*c-2*b*c*cosd(A));return{q:`Un lote triangular tiene lados de ${b} m y ${c} m que forman ${A}°. ¿Cuánto mide el tercer lado?`,a,u:'m',s:[`Ley de cosenos: a² = b² + c² − 2bc cos A`,`a² = ${b*b} + ${c*c} − 2(${b})(${c}) cos ${A}° = ${n(a*a)}`,`a = ${n(a)} m`]};},
r=>{const A=r.i(40,70,2),B=r.i(35,65,2),b=r.i(60,300,10);const C=180-A-B,ac=b*sind(B)/sind(C),h=ac*sind(A);return{q:`Para medir el ancho de un río se fija una base AB = ${b} m en una orilla. Hacia un árbol C en la otra orilla se miden los ángulos A = ${A}° y B = ${B}°. ¿Cuál es el ancho del río (distancia perpendicular de C a la base)?`,a:h,u:'m',s:[`Ángulo en C = 180 − ${A} − ${B} = ${C}°`,`Ley de senos: AC = AB·sen B / sen C = ${n(ac)} m`,`Ancho = AC·sen A = ${n(h)} m`]};}
]});
SUB('vec',{t:'Vectores y fuerzas',
lec:`Una fuerza no es solo un número: tiene **dirección**. Por eso se representa con un vector y se separa en componentes.

Si un cable tira con fuerza F a un ángulo θ de la horizontal:

- Componente horizontal: F·cos θ
- Componente vertical: F·sen θ

Para sumar fuerzas, suma las x con las x y las y con las y. Al final recompones: la resultante es la hipotenusa.

**Producto cruz:** el momento es r × F. Solo la parte de la fuerza perpendicular al brazo hace girar, igual que cuando empujas una puerta: cerca de la bisagra cuesta más.`,
key:['F_{x} = F cos θ, F_{y} = F sen θ','R = √{F_{x}^{2} + F_{y}^{2}}','θ = arctan([[F_{y}|F_{x}]])','M = x·F_{y} − y·F_{x}'],
err:'Usar siempre coseno para x. Depende de desde qué eje mides el ángulo.',
x:[['par','El equilibrio es exigir que la suma de vectores sea cero'],['mom','El momento nace del producto cruz'],['rig','Las matrices de rigidez rotan componentes con coseno y seno']],
g:[
r=>{const F=r.i(5,100,5),t=r.i(15,75,5);const a=F*cosd(t);return{q:`Una fuerza de ${F} kN forma ${t}° con el eje x. Calcula F_{x}.`,a,u:'kN',s:[`F_{x} = F cos θ = ${F} × cos ${t}° = ${n(a)} kN`]};},
r=>{const x=r.i(3,60,1),y=r.i(4,80,1);const a=sq(x*x+y*y);return{q:`Una fuerza tiene componentes F_{x} = ${x} kN y F_{y} = ${y} kN. ¿Cuál es su magnitud?`,a,u:'kN',s:[`R = √(${x}² + ${y}²) = ${n(a)} kN`]};},
r=>{const F1=r.i(10,60,5),t1=r.i(10,40,5),F2=r.i(10,60,5),t2=r.i(50,85,5);const X=F1*cosd(t1)+F2*cosd(t2),Y=F1*sind(t1)+F2*sind(t2),a=sq(X*X+Y*Y);return{q:`Dos cables tiran de un gancho: ${F1} kN a ${t1}° y ${F2} kN a ${t2}°, medidos desde el eje x. Calcula la resultante.`,a,u:'kN',s:[`ΣF_{x} = ${n(X)} kN`,`ΣF_{y} = ${n(Y)} kN`,`R = √(${n(X)}² + ${n(Y)}²) = ${n(a)} kN`]};},
r=>{const F1=r.i(10,60,5),t1=r.i(10,40,5),F2=r.i(10,60,5),t2=r.i(100,170,5);const X=F1*cosd(t1)+F2*cosd(t2),Y=F1*sind(t1)+F2*sind(t2);let a=Math.atan2(Y,X)*180/PI;return{q:`Se suman ${F1} kN a ${t1}° y ${F2} kN a ${t2}°. ¿Qué ángulo forma la resultante con el eje x?`,a,u:'°',s:[`ΣF_{x} = ${n(X)}, ΣF_{y} = ${n(Y)}`,`θ = atan2(ΣF_{y}, ΣF_{x}) = ${n(a)}°`]};},
r=>{const F=r.i(10,80,5),t=r.i(20,70,5),x=r.i(1,6,.5),y=r.i(1,5,.5);const Fx=F*cosd(t),Fy=F*sind(t),a=x*Fy-y*Fx;return{q:`Una fuerza de ${F} kN a ${t}° actúa en el punto (${x}, ${y}) m. Calcula su momento respecto al origen (positivo antihorario).`,a,u:'kN·m',s:[`F_{x} = ${n(Fx)}, F_{y} = ${n(Fy)}`,`M = x·F_{y} − y·F_{x} = ${x}(${n(Fy)}) − ${y}(${n(Fx)}) = ${n(a)} kN·m`]};}
]});
SUB('sis',{t:'Sistemas de ecuaciones y matrices',
lec:`Una estructura real se resuelve con cientos de ecuaciones simultáneas. Los programas como ETABS arman la matriz y la resuelven. Tú debes entender qué hacen.

Un sistema [A]{x} = {b} se resuelve por eliminación: combinas filas hasta dejar una sola incógnita por ecuación. En 2×2 se usa rápido la **regla de Cramer** con el determinante.

**Ejemplo mental:** dos resortes en serie comparten fuerzas. Cada nudo da una ecuación; cada desplazamiento es una incógnita. Eso es exactamente el método de rigidez.

Si el determinante vale cero, la estructura es un **mecanismo**: se mueve sin resistir. El álgebra te avisa de un colapso.`,
key:['det = ad − bc','x = [[(d·e − b·f)|det]], y = [[(a·f − c·e)|det]]'],
err:'Intercambiar el orden de las incógnitas al armar la matriz y no reordenar el vector de resultados.',
x:[['rig','El método matricial de rigidez es [K]{d} = {F}'],['arm','Los nudos de una armadura forman un sistema'],['crs','Cross resuelve iterativamente el mismo sistema']],
g:[
r=>{const a=r.i(1,9),b=r.i(1,9),c=r.i(1,9),d=r.i(1,9);const D=a*d-b*c;return{q:`Calcula el determinante de la matriz con filas (${a}, ${b}) y (${c}, ${d}).`,a:D,u:'',s:[`det = ${a}·${d} − ${b}·${c} = ${D}`]};},
r=>{const x=r.i(1,9),y=r.i(1,9),a=r.i(1,5),b=r.i(1,5);const e=x+y,f=a*x+b*y;if(a===b)return{q:`Si x + y = ${e} y x − y = ${x-y}, ¿cuánto vale x?`,a:x,u:'',s:[`Suma ambas ecuaciones: 2x = ${2*x}`,`x = ${x}`]};return{q:`Resuelve: x + y = ${e}; ${a}x + ${b}y = ${f}. ¿Cuánto vale x?`,a:x,u:'',s:[`De la primera: y = ${e} − x`,`${a}x + ${b}(${e} − x) = ${f}`,`x = ${x}`]};},
r=>{const P=r.i(10,60,2),L=r.i(4,12),aa=r.i(1,L-1);const Rb=P*aa/L;return{q:`Una viga simple de ${L} m lleva ${P} kN a ${aa} m del apoyo A. Plantea R_{A}+R_{B}=P y ΣM_{A}=0 y halla R_{B}.`,a:Rb,u:'kN',s:[`Momentos en A: R_{B}·${L} = ${P}·${aa}`,`R_{B} = ${n(Rb)} kN`]};},
r=>{const k1=r.i(100,500,50),k2=r.i(100,500,50),F=r.i(5,50,5);const d2=F/k1+F/k2;return{q:`Dos resortes en serie (k_{1}=${k1} kN/m fijo al muro, k_{2}=${k2} kN/m) reciben F=${F} kN en el extremo libre. Con [K]{d}={F}, halla el desplazamiento del extremo en mm.`,a:d2*1000,u:'mm',s:[`Ambos resortes llevan F: d_{1} = F/k_{1} = ${n(F/k1)} m`,`d_{2} = d_{1} + F/k_{2} = ${n(d2)} m`,`= ${n(d2*1000)} mm`]};},
r=>{const x=r.i(1,6),y=r.i(1,6),z=r.i(1,6);const A=[[2,1,1],[1,3,2],[1,0,2]];const b=A.map(f=>f[0]*x+f[1]*y+f[2]*z);return{q:`Tres nudos cumplen: 2x + y + z = ${b[0]}; x + 3y + 2z = ${b[1]}; x + 2z = ${b[2]}. ¿Cuánto vale z?`,a:z,u:'',s:[`De la tercera: x = ${b[2]} − 2z`,`En la primera: y = ${b[0]} − 2x − z = ${b[0]} − 2(${b[2]}−2z) − z`,`Sustituye en la segunda y despeja: z = ${z}, x = ${x}, y = ${y}`]};}
]});

SUB('der',{t:'Derivadas y optimización',
lec:`Una derivada mide **qué tan rápido cambia algo**. Si M(x) es el momento en una viga, su derivada es el cortante V(x). Donde V = 0 el momento es máximo. Esa es la idea más útil del curso.

## Reglas básicas
- d(x^{n})/dx = n·x^{n−1}
- La derivada de una constante es 0
- Para optimizar: deriva, iguala a cero y despeja

**Ejemplo didáctico:** quieres el canal de mayor sección con la misma cantidad de concreto. Escribes el área en función de una sola variable, derivas e igualas a cero.`,
key:['[[dM|dx]] = V, [[dV|dx]] = −w','Máximo: f′(x) = 0'],
err:'Olvidar comprobar si el punto hallado es máximo o mínimo.',
x:[['vm','V es la derivada de M: de aquí sale el punto de momento máximo'],['man','La sección hidráulica óptima se obtiene derivando'],['ver','La curva vertical es una parábola: su derivada da la pendiente']],
g:[
r=>{const a=r.i(2,9),b=r.i(2,4),x=r.i(1,6);const v=a*b*x**(b-1);return{q:`Si f(x) = ${a}x^{${b}}, calcula f′(${x}).`,a:v,u:'',s:[`f′(x) = ${a*b}x^{${b-1}}`,`f′(${x}) = ${v}`]};},
r=>{const w=r.i(2,30),L=r.i(4,12),x=r.i(1,L-1);const V=w*L/2-w*x;return{q:`En una viga simple con w=${w} kN/m y L=${L} m, M(x) = ${w*L/2}x − ${w/2}x². Calcula V(${x}) = dM/dx.`,a:V,u:'kN',s:[`V(x) = ${w*L/2} − ${w}x`,`V(${x}) = ${V} kN`]};},
r=>{const w=r.i(2,30),L=r.i(4,12);const x=L/2,M=w*L*L/8;return{q:`Para M(x) = ${w*L/2}x − ${w/2}x², halla el momento máximo.`,a:M,u:'kN·m',s:[`M′(x) = ${w*L/2} − ${w}x = 0`,`x = ${x} m`,`M = ${n(M)} kN·m`]};},
r=>{const P=r.i(20,120,4);const b=P/4,a=b*2;return{q:`Con ${P} m de cerco se encierra un terreno rectangular junto a un río (no se cerca ese lado). ¿Cuál es el área máxima?`,a:a*b,u:'m²',s:[`2y + x = ${P}, A = xy = (${P} − 2y)y`,`dA/dy = ${P} − 4y = 0, y = ${b} m`,`x = ${a} m, A = ${a*b} m²`]};},
r=>{const A=r.i(2,20,.5);const y=sq(A/2),b=2*y;return{q:`Un canal rectangular debe tener área A=${A} m² con perímetro mojado mínimo (P=b+2y). Halla el tirante óptimo y.`,a:y,u:'m',s:[`b = A/y, entonces P = A/y + 2y`,`dP/dy = −A/y² + 2 = 0`,`y = √(A/2) = ${n(y)} m (y b = 2y = ${n(b)} m)`]};}
]});
SUB('int',{t:'Integrales: áreas y centroides',
lec:`Integrar es **sumar infinitas tiras**. El área bajo el diagrama de carga es el cortante acumulado; el área bajo el cortante es el momento.

## Usos en obra
- Área de una sección irregular
- Resultante de una carga distribuida: es el área del diagrama
- Centroide: x̄ = ∫x dA / ∫dA, el punto donde actúa la resultante
- Volúmenes de tierra entre secciones

**Imagen:** una carga triangular sobre una viga, como el empuje del agua, equivale a una sola fuerza aplicada a 1/3 de la base.`,
key:['∫x^{n}dx = [[x^{n+1}|n+1]]','R = ∫w(x)dx','x̄ = [[∫x·w dx|∫w dx]]'],
err:'Poner mal los límites de integración, sobre todo en cargas que empiezan a la mitad de la viga.',
x:[['vm','Los diagramas de V y M son integrales'],['cen','El centroide de secciones usa esta fórmula'],['fhi','La fuerza del agua sobre una pared es la integral de la presión'],['def','La deflexión se obtiene integrando dos veces']],
g:[
r=>{const a=r.i(1,6),b=r.i(a+1,10),c=r.i(2,9);const v=c*(b*b-a*a)/2;return{q:`Calcula ∫ ${c}x dx entre x=${a} y x=${b}.`,a:v,u:'',s:[`Primitiva: ${c/2}x²`,`${c/2}(${b*b} − ${a*a}) = ${n(v)}`]};},
r=>{const w=r.i(4,40,2),L=r.i(3,12);return{q:`Una carga triangular crece de 0 a ${w} kN/m en ${L} m. ¿Cuánto vale su resultante?`,a:w*L/2,u:'kN',s:[`Resultante = área = ½·${w}·${L} = ${w*L/2} kN`]};},
r=>{const w=r.i(4,40,2),L=r.i(3,12);return{q:`Para esa misma forma (carga triangular de 0 a ${w} kN/m en ${L} m), ¿a qué distancia del vértice en cero actúa la resultante?`,a:2*L/3,u:'m',s:[`x̄ = ∫x·(${w}x/${L})dx / R`,`Para un triángulo: x̄ = 2L/3 = ${n(2*L/3)} m`]};},
r=>{const c=r.i(1,5),L=r.i(2,8);const v=c*L**3/3;return{q:`La carga en una viga es w(x) = ${c}x² kN/m entre 0 y ${L} m. Calcula la resultante.`,a:v,u:'kN',s:[`R = ∫${c}x²dx = ${c}x³/3`,`R = ${c}·${L**3}/3 = ${n(v)} kN`]};},
r=>{const c=r.i(1,5),L=r.i(2,8);const R=c*L**3/3,M=c*L**4/4;return{q:`Con w(x) = ${c}x² kN/m entre 0 y ${L} m, ¿a qué distancia del origen actúa la resultante?`,a:M/R,u:'m',s:[`R = ${n(R)} kN`,`∫x·w dx = ${c}L⁴/4 = ${n(M)}`,`x̄ = ${n(M)}/${n(R)} = ${n(M/R)} m (siempre 3L/4 en este caso)`]};}
]});
SUB('edo',{t:'Ecuaciones diferenciales',
lec:`Una ecuación diferencial relaciona una cantidad con su ritmo de cambio. Aparece cuando un fenómeno depende de su propio estado:

- **Asentamiento:** el suelo se consolida rápido al inicio y lento al final.
- **Vibración:** m·ü + k·u = 0 describe un edificio oscilando.
- **Decaimiento:** dC/dt = −kC describe la DBO de un río, y también el tiempo de vaciado.
- **Crecimiento:** dP/dt = rP es la población geométrica.

La solución de dy/dt = k·y es siempre una exponencial: y = y_{0}·e^{kt}.`,
key:['[[dy|dt]] = ky → y = y_{0}e^{kt}','mü + ku = 0 → ω = √{k/m}'],
err:'Confundir la constante k positiva (crecimiento) y negativa (decaimiento).',
x:[['osc','La oscilación libre es una EDO de segundo orden'],['cns','La consolidación de Terzaghi es una ecuación diferencial'],['pob','El crecimiento geométrico sale de dP/dt = rP'],['pta','La DBO decae exponencialmente']],
g:[
r=>{const y0=r.i(10,200,10),k=r.i(.05,.5,.05),t=r.i(1,10);const a=y0*Math.exp(-k*t);return{q:`Si dC/dt = −${k}C y C(0)=${y0} mg/L, halla C a los t=${t} días.`,a,u:'mg/L',s:[`C = C_{0}e^{−kt}`,`C = ${y0}·e^{−${n(k*t)}} = ${n(a)} mg/L`]};},
r=>{const P=r.i(1000,50000,500),rr=r.i(.5,3.5,.5),t=r.i(5,30,5);const a=P*Math.exp(rr/100*t);return{q:`Una población de ${P} hab. crece según dP/dt = rP con r=${rr} % anual. ¿Cuántos habrá en ${t} años?`,a,u:'hab',s:[`P = P_{0}e^{rt}`,`P = ${P}·e^{${n(rr/100*t)}} = ${n(a,6)}`]};},
r=>{const k=r.i(.05,.5,.01);const a=Math.log(2)/k;return{q:`Si una sustancia decae con k=${k} 1/día, ¿cuál es su vida media?`,a,u:'días',s:[`½ = e^{−kt}`,`t = ln 2 / k = ${n(a)} días`]};},
r=>{const y0=r.i(50,500,50),t1=r.i(1,5),ff=r.i(40,80,5);const k=-Math.log(ff/100)/t1;return{q:`Un contaminante baja de ${y0} a ${n(y0*ff/100)} mg/L en ${t1} días (decaimiento exponencial). Halla k.`,a:k,u:'1/día',s:[`e^{−k·${t1}} = ${ff/100}`,`k = −ln(${ff/100})/${t1} = ${n(k)} 1/día`]};},
r=>{const m=r.i(10,200,10),k=r.i(1000,40000,1000);const w=sq(k/m),T=2*PI/w;return{q:`Una masa de ${m} t sobre una rigidez lateral de ${k} kN/m cumple mü+ku=0. Halla su periodo natural.`,a:T,u:'s',s:[`ω = √(k/m) = √(${k}/${m}) = ${n(w)} rad/s (kN/t = m/s²)`,`T = 2π/ω = ${n(T)} s`]};}
]});

SUB('est',{t:'Estadística de control de obra',
lec:`Rompes probetas de concreto y cada una da un valor distinto. ¿Cuál es la resistencia real? Necesitas dos números: el **promedio** y la **desviación estándar**, que mide la dispersión.

## Para qué sirve
La norma exige diseñar la mezcla con una resistencia mayor a la especificada, f'_{cr} > f'_{c}, para que pocas probetas salgan por debajo. Cuanto peor es el control de obra (mayor s), más cemento debes pagar.

El coeficiente de variación CV = s/x̄ permite comparar la calidad de dos obras distintas.`,
key:['x̄ = [[Σx|n]]','s = √{[[Σ(x−x̄)^{2}|n−1]]}','CV = [[s|x̄]]','f\'_{cr} = f\'_{c} + 1.34s'],

SUB('pro',{t:'Probabilidad y periodo de retorno',
lec:`¿Una lluvia de 100 años cae una vez cada 100 años? **No**. Significa que cada año tiene 1 % de probabilidad de ocurrir. Puede caer dos años seguidos.

## Riesgo
Si una obra dura n años, la probabilidad de ver al menos una vez un evento de periodo T es:

R = 1 − (1 − 1/T)^{n}

La norma sísmica peruana usa un sismo con 10 % de probabilidad de ser superado en 50 años. Eso da T = 475 años.

## Distribución normal
Muchos datos se agrupan en campana. El valor z = (x − x̄)/s indica a cuántas desviaciones estás del promedio.`,
key:['R = 1 − (1 − [[1|T]])^{n}','z = [[x − x̄|s]]'],
err:'Creer que tras un evento grande hay que esperar T años para el siguiente.',
x:[['rac','El caudal de diseño depende del periodo de retorno'],['esp','El factor Z de la norma E.030 sale de este cálculo'],['est','z conecta la dispersión con la falla']],

r=>{const T=r.p([10,25,50,100,200]),m=r.i(5,50,5);const a=(1-(1-1/T)**m)*100;return{q:`Una obra de ${m} años de vida se expone a un evento de T=${T} años. ¿Cuál es el riesgo de que ocurra al menos una vez?`,a,u:'%',s:[`R = 1 − (1 − 1/${T})^{${m}}`,`R = ${n(a)} %`]};},
r=>{const x=r.i(180,260,5),m=r.i(210,280,5),s=r.i(15,40,5);const a=(x-m)/s;return{q:`Un dato vale x=${x}, con promedio ${m} y s=${s}. Calcula z.`,a,u:'',s:[`z = (${x} − ${m}) / ${s} = ${n(a)}`]};},
r=>{const m=r.p([10,20,25,30,50]),R=r.p([5,10,20,30,50]);const T=1/(1-(1-R/100)**(1/m));return{q:`Para un riesgo aceptable de ${R} % en ${m} años, ¿qué periodo de retorno debe usarse?`,a:T,u:'años',s:[`1 − 1/T = (1 − ${R/100})^{1/${m}}`,`T = ${n(T)} años`]};},

]});
SUB('num',{t:'Métodos numéricos',
lec:`Muchas ecuaciones de ingeniería no se despejan. La ecuación de Manning para el tirante de un canal o la de Colebrook para tuberías se resuelven por tanteos ordenados.

## Newton-Raphson
Parte de una suposición y mejora con la tangente: x_{nuevo} = x − f(x)/f′(x). Converge muy rápido si empiezas cerca.

## Trapecio
Para integrar datos de campo, como secciones de un río o de una vía, parte el área en trapecios y súmalos. Con **Simpson** logras más precisión usando parábolas.

## Por qué importa
Todo programa de análisis usa estos métodos. Si conoces el método, sabrás cuándo un resultado no es confiable.`,
key:['x_{i+1} = x_{i} − [[f(x_{i})|f′(x_{i})]]','A ≈ [[h|2]](y_{0} + 2y_{1} + … + y_{n})','Simpson: [[h|3]](y_{0} + 4y_{1} + y_{2})'],
err:'Dejar de iterar antes de que el resultado se estabilice.',
x:[['fpe','Colebrook se resuelve iterando'],['man','El tirante normal requiere tanteos'],['are','El área de un río se integra con trapecio y Simpson']],
g:[
r=>{const h=r.i(1,5),a=r.i(2,10),b=r.i(2,10);return{q:`Con franjas de ${h} m, las alturas son ${a} y ${b} m en un trapecio. Calcula el área.`,a:h*(a+b)/2,u:'m²',s:[`A = h(y₀+y₁)/2 = ${n(h*(a+b)/2)} m²`]};},
r=>{const h=r.i(2,10),y=[r.i(0,3,.5),r.i(1,5,.5),r.i(2,6,.5),r.i(1,5,.5),r.i(0,3,.5)];const a=h/2*(y[0]+2*(y[1]+y[2]+y[3])+y[4]);return{q:`Profundidades de un río cada ${h} m: ${y.join(', ')} m. Calcula el área por trapecios.`,a,u:'m²',s:[`A = h/2·(y₀ + 2Σyᵢ + yₙ)`,`A = ${h/2}·(${y[0]} + 2·${y[1]+y[2]+y[3]} + ${y[4]}) = ${n(a)} m²`]};},
r=>{const h=r.i(2,10),y=[r.i(1,3,.5),r.i(2,6,.5),r.i(1,3,.5)];const a=h/3*(y[0]+4*y[1]+y[2]);return{q:`Con Simpson y h=${h} m, las ordenadas son ${y.join(', ')} m. Calcula el área.`,a,u:'m²',s:[`A = h/3·(y₀+4y₁+y₂) = ${n(a)} m²`]};},

r=>{const c=r.i(2,40);let x=2;for(let i=0;i<8;i++)x=x-(x*x*x+x-c)/(3*x*x+1);return{q:`Halla la raíz real de x³ + x = ${c} con 3 decimales usando Newton-Raphson.`,a:x,u:'',tol:.003,s:[`f(x)=x³+x−${c}, f′(x)=3x²+1`,`Itera desde x₀=2 hasta estabilizar`,`x ≈ ${n(x,5)}`]};}
]});

SUB('new',{t:'Leyes de Newton',
lec:`**F = m·a** es la base de todo. Si la aceleración es cero, la suma de fuerzas es cero: eso es la estática.

- Más masa: T mayor, vibra más lento.

SUB('arm',{t:'Armaduras',
lec:`Una armadura es una estructura de barras unidas en nudos. Cada barra solo trabaja a **tensión o compresión**. Así se aprovecha mucho el material: por eso cubren coliseos y puentes.

## Dos métodos
- **Nudos:** equilibra nudo por nudo, empezando donde haya máximo dos incógnitas.
- **Secciones:** corta la armadura y usa ΣM para hallar directamente una barra.

Condición para armadura plana estáticamente determinada: b + r = 2n.`,
key:['b + r = 2n','F_{cuerda} = [[M|h]]'],fig:'armadura',
err:'Suponer sentido de la fuerza y olvidar el signo. Negativo significa que era compresión.',
x:[['par','Cada nudo es equilibrio de partícula'],['ten','Las barras a tensión se diseñan en acero'],['com','Las barras a compresión pueden pandear'],['det','La condición b+r=2n es indeterminación']],
g:[
r=>{const nn=r.i(4,20),rr=3;const b=2*nn-rr;return{q:`Una armadura plana de ${nn} nudos con r=3 reacciones es determinada. ¿Cuántas barras tiene?`,a:b,u:'barras',s:[`b + r = 2n, b = ${2*nn} − 3 = ${b}`]};},
r=>{const P=r.i(10,80,5),t=r.i(30,60,5);const F=P/2/sind(t);return{q:`Armadura triangular simétrica con P=${P} kN en la cumbre y barras inclinadas ${t}°. Halla la fuerza en cada barra inclinada.`,a:F,u:'kN (compresión)',s:[`Reacciones = P/2`,`Nudo de apoyo: F sen ${t}° = ${P/2}`,`F = ${n(F)} kN`]};},
r=>{const P=r.i(10,80,5),t=r.i(30,60,5);const T=P/2/tand(t);return{q:`En esa misma armadura (P=${P} kN, ${t}°), halla la tensión en la barra inferior horizontal.`,a:T,u:'kN',s:[`Nudo de apoyo: T = F cos θ = (P/2)/tan θ`,`T = ${n(T)} kN`]};},
r=>{const P=r.i(10,40,5),d=r.i(2,5),h=r.i(2,4);const R=2.5*P,M=R*2*d-P*d;const F=M/h;return{q:`Armadura Pratt de 6 paneles de ${d} m y altura ${h} m, con P=${P} kN en cada uno de los 5 nudos interiores (R=${R} kN). Corta en el nudo a 2 paneles del apoyo y halla la fuerza en la cuerda opuesta.`,a:F,u:'kN',s:[`M = R·2d − P·d = ${n(R)}·${2*d} − ${P}·${d} = ${n(M)} kN·m`,`F = M/h = ${n(F)} kN`]};},
r=>{const w=r.i(1,5,.5),L=r.i(12,36,3),h=r.i(2,6);const M=w*L*L/8;const F=M/h;return{q:`Una armadura de L=${L} m y altura ${h} m lleva w=${w} kN/m. Trátala como viga: ¿qué fuerza lleva la cuerda en el centro?`,a:F,u:'kN',s:[`M_{máx} = wL²/8 = ${n(M)} kN·m`,`F = M/h = ${n(F)} kN`,`Es la misma lógica de una viga: el par de fuerzas iguala al momento`]};}
]});
SUB('cen',{t:'Centroides e inercia',
lec:`El **centroide** es el punto de equilibrio de una forma. El **momento de inercia** I mide qué tan lejos del centroide está el material.

Esto explica por qué una regla es fácil de doblar de plano y casi imposible de canto: I crece con la altura al cubo. Por eso las vigas son altas y angostas, y las secciones I concentran el acero lejos del centro.

## Teorema de ejes paralelos
Para secciones compuestas: suma la I propia de cada parte más su área por la distancia al cuadrado.`,
key:['ȳ = [[ΣA_{i}y_{i}|ΣA_{i}]]','I_{rect} = [[b·h^{3}|12]]','I_{circ} = [[π·d^{4}|64]]','I = I_{0} + A·d^{2}'],fig:'seccion',
err:'Elevar b al cubo en lugar de h, la dimensión perpendicular al eje.',
x:[['flx','I controla el esfuerzo de flexión'],['def','La deflexión es inversamente proporcional a EI'],['pan','El pandeo depende de la I menor']],
g:[
r=>{const b=r.i(20,60,5),h=r.i(30,90,5);return{q:`Sección rectangular de ${b}×${h} cm. Calcula I respecto a su eje horizontal centroidal.`,a:b*h**3/12,u:'cm⁴',s:[`I = bh³/12 = ${b}·${h}³/12 = ${n(b*h**3/12,6)} cm⁴`]};},
r=>{const d=r.i(20,120,5);return{q:`Columna circular de ${d} cm de diámetro. Halla I.`,a:PI*d**4/64,u:'cm⁴',s:[`I = πd⁴/64 = ${n(PI*d**4/64,6)} cm⁴`]};},
r=>{const b=r.i(60,180,10),e=r.i(5,20,5),w=r.i(20,40,5),h=r.i(30,70,5);const A1=b*e,A2=w*h,y1=h+e/2,y2=h/2,yb=(A1*y1+A2*y2)/(A1+A2);return{q:`Viga T: ala ${b}×${e} cm sobre alma ${w}×${h} cm. Halla ȳ medido desde la base.`,a:yb,u:'cm',s:[`A₁=${A1} cm² con y=${n(y1)}; A₂=${A2} cm² con y=${n(y2)}`,`ȳ = ΣAy/ΣA = ${n(yb)} cm`]};},
r=>{const b=r.i(60,180,10),e=r.i(5,20,5),w=r.i(20,40,5),h=r.i(30,70,5);const A1=b*e,A2=w*h,y1=h+e/2,y2=h/2,yb=(A1*y1+A2*y2)/(A1+A2);const I=b*e**3/12+A1*(y1-yb)**2+w*h**3/12+A2*(y2-yb)**2;return{q:`Para esa sección T (ala ${b}×${e}, alma ${w}×${h} cm), calcula I centroidal.`,a:I,u:'cm⁴',s:[`ȳ = ${n(yb)} cm`,`Ala: ${n(b*e**3/12)} + ${A1}·${n(y1-yb)}²`,`Alma: ${n(w*h**3/12)} + ${A2}·${n(y2-yb)}²`,`I = ${n(I,6)} cm⁴`]};},
r=>{const bf=r.i(15,30,1),tf=r.i(1,2.5,.25),hw=r.i(25,55,5),tw=r.i(.8,1.4,.2);const h=hw+2*tf;const I=(bf*h**3-(bf-tw)*hw**3)/12;return{q:`Perfil I de acero: alas ${bf}×${tf} cm, alma ${hw}×${tw} cm. Halla I_{x}.`,a:I,u:'cm⁴',s:[`Altura total H = ${n(h)} cm`,`Rectángulo total menos huecos: I=[b_{f}H³−(b_{f}−t_{w})h_{w}³]/12`,`I = ${n(I,6)} cm⁴`]};}
]});
SUB('fri',{t:'Fricción',
lec:`La fricción se opone al deslizamiento: F = μ·N, donde N es la fuerza normal. No depende del área de contacto.

## En ingeniería civil
- Un muro de contención no desliza gracias a la fricción con el suelo.
- En suelos, el ángulo φ actúa como fricción interna: μ = tan φ.
- Un bloque en plano inclinado desliza cuando tan θ > μ. De ahí viene la estabilidad de taludes.`,
key:['F_{máx} = μ·N','μ = tan φ','FS = [[μ·N|F]]'],
err:'Tomar N igual al peso aunque el plano esté inclinado. Allí N = W cos θ.',
x:[['res','El φ de Mohr-Coulomb es fricción'],['emp','El muro se verifica al deslizamiento'],['tal','El talud infinito es un bloque en plano']],
g:[
r=>{const N=r.i(10,200,10),m=r.p([.3,.4,.5,.6,.7]);return{q:`Un bloque con N=${N} kN y μ=${m}. ¿Cuál es la fricción máxima?`,a:N*m,u:'kN',s:[`F = μN = ${n(N*m)} kN`]};},
r=>{const p=r.i(15,40,1);return{q:`Un suelo tiene φ=${p}°. ¿Cuál es el coeficiente de fricción equivalente?`,a:tand(p),u:'',s:[`μ = tan ${p}° = ${n(tand(p))}`]};},
r=>{const W=r.i(20,300,10),t=r.i(5,30,5),m=r.p([.3,.4,.5,.6,.7]);const N=W*cosd(t),T=W*sind(t),FS=m*N/T;return{q:`Bloque de ${W} kN en plano de ${t}° con μ=${m}. Calcula el factor de seguridad al deslizamiento.`,a:FS,u:'',s:[`N = W cos θ = ${n(N)} kN`,`Fuerza que empuja = W sen θ = ${n(T)} kN`,`FS = ${n(m*N)}/${n(T)} = ${n(FS)}`]};},
r=>{const W=r.i(50,400,10),H=r.i(10,120,5),m=r.p([.45,.5,.55,.6]);return{q:`Un muro pesa ${W} kN/m, recibe empuje horizontal ${H} kN/m y μ=${m}. Calcula el FS al deslizamiento.`,a:m*W/H,u:'',s:[`FS = μW/E = ${n(m*W/H)}`,`La norma pide normalmente FS ≥ 1.5`]};},
r=>{const W=r.i(50,300,10),t=r.i(20,35,5),m=r.p([.1,.2,.3]);const F=W*(sind(t)+m*cosd(t));const F2=W*(sind(t)-m*cosd(t));return{q:`Un bloque de ${W} kN en una rampa de ${t}° con μ=${m} se detiene con un cable paralelo a la rampa. ¿Tensión mínima para que no baje?`,a:Math.max(0,F2),u:'kN',s:[`Componente paralela = ${n(W*sind(t))} kN`,`Fricción ayuda: ${n(m*W*cosd(t))} kN`,`T = ${n(Math.max(0,F2))} kN`]};}
]});

SUB('axi',{t:'Esfuerzo y deformación axial',
lec:`**Esfuerzo** es fuerza por unidad de área: el mismo peso duele más en un tacón que en una zapatilla. **Deformación** es cuánto se alarga cada metro.

Mientras el material es elástico, ambos son proporcionales por la **ley de Hooke**. El módulo E indica la rigidez:

- Acero: E ≈ 2 000 000 kg/cm² (200 GPa)
- Concreto: E ≈ 15 000√f'_{c} kg/cm²

## Acero y concreto juntos
En una columna, ambos se acortan igual. Así el material más rígido toma más carga: se reparte según n = E_{s}/E_{c}.`,
key:['σ = [[P|A]]','ε = [[δ|L]]','σ = E·ε','δ = [[P·L|A·E]]','E_{c} = 15000√{f\'_{c}}'],
err:'Usar el diámetro como radio en el área, o dejar P en toneladas y A en cm².',
x:[['ten','El diseño a tensión parte de σ=P/A'],['col','La columna de concreto armado reparte carga con n'],['cns','El suelo también se comprime con δ=H·ε']],

r=>{const s=r.i(500,4000,100),L=r.i(1,12,.5);const dl=s/2e6*L*1000;return{q:`Una barra de acero con σ=${s} kg/cm² y L=${L} m. ¿Cuánto se alarga?`,a:dl,u:'mm',s:[`ε = σ/E = ${n(s/2e6)}`,`δ = εL = ${n(dl)} mm`]};},
r=>{const fc=r.i(140,560,5);return{q:`Calcula E_{c} para f'_{c}=${fc} kg/cm² (E_{c}=15000√f'_{c}).`,a:15000*sq(fc),u:'kg/cm²',s:[`E_{c} = 15000·√${fc} = ${n(15000*sq(fc),6)} kg/cm²`]};},
r=>{const P=r.i(5,50,5),L=r.i(2,8),A=r.i(5,30,1);const dl=P*1000*L*100/(A*2e6)*10;return{q:`Tirante de acero A=${A} cm², L=${L} m con P=${P} t. Halla δ.`,a:dl,u:'mm',s:[`δ = PL/(AE)`,`δ = ${P*1000}·${L*100}/(${A}·2×10⁶) = ${n(dl/10)} cm = ${n(dl)} mm`]};},
r=>{const fc=r.p([210,280,350]),b=r.i(25,50,5),h=r.i(25,50,5),As=r.p([12,16,20,24,30]),P=r.i(50,250,10);const Ec=15000*sq(fc),nn=2e6/Ec,At=b*h+(nn-1)*As;const s=P*1000/At;return{q:`Columna de ${b}×${h} cm con A_{s}=${As} cm² y f'_{c}=${fc}, carga P=${P} t en rango elástico. Halla σ en el concreto usando sección transformada.`,a:s,u:'kg/cm²',s:[`n = E_{s}/E_{c} = ${n(nn)}`,`A_{t} = A_{g} + (n−1)A_{s} = ${n(At)} cm²`,`σ_{c} = P/A_{t} = ${n(s)} kg/cm²`,`El acero lleva n·σ_{c} = ${n(nn*s)} kg/cm²`]};}

SUB('tor',{t:'Torsión',
lec:`Torsión es retorcer un elemento, como exprimir una toalla. Aparece en vigas de borde que sostienen losas en voladizo y en edificios asimétricos que giran durante un sismo.

Las secciones **huecas y circulares** son las más eficientes, pues el material está lejos del centro.

- El esfuerzo cortante crece desde 0 en el centro hasta el máximo en la superficie.
- J es el momento polar de inercia.`,

SUB('vm',{t:'Diagramas de cortante y momento',
lec:`Esta es la herramienta más usada del ingeniero estructural. Corta la viga en cualquier punto y pregúntate qué fuerza y qué momento transmite. Al graficarlos ves dónde reforzar.

## Reglas de oro
- La pendiente de V es la carga: V′ = −w
- La pendiente de M es V: M′ = V
- M es máximo donde V cruza cero
- En carga puntual V salta; en momento puntual M salta

## Casos que debes saber de memoria
- Simple con w: M = wL²/8
- Simple con P centrada: M = PL/4
- Voladizo con w: M = wL²/2
- Empotrada con w: M = wL²/12 en apoyos y wL²/24 en centro

Prueba el laboratorio de abajo: mueve la carga y mira cómo cambian los diagramas.`,
key:['M_{máx} = [[w·L^{2}|8]]','M_{máx} = [[P·L|4]]','[[dM|dx]] = V'],lab:'viga',
err:'Olvidar que M es máximo donde V=0, no necesariamente en el centro.',
x:[['der','M\' = V es la derivada aplicada'],['flx','Con M calculas el esfuerzo'],['fle','Con M calculas el acero'],['car','w viene del metrado']],
g:[
r=>{const w=r.i(5,50,5),L=r.i(3,12);return{q:`Viga simple, w=${w} kN/m, L=${L} m. Halla M máx.`,a:w*L*L/8,u:'kN·m',s:[`M = wL²/8 = ${n(w*L*L/8)} kN·m`]};},
r=>{const P=r.i(10,100,5),L=r.i(3,12);return{q:`Viga simple, P=${P} kN en el centro, L=${L} m. Halla M máx.`,a:P*L/4,u:'kN·m',s:[`M = PL/4 = ${n(P*L/4)} kN·m`]};},
r=>{const P=r.i(10,100,5),L=r.i(4,12),a=r.i(1,L-1);return{q:`Viga simple L=${L} m, P=${P} kN a ${a} m de A. Halla el momento bajo la carga.`,a:P*a*(L-a)/L,u:'kN·m',s:[`R_{A} = P(L−a)/L = ${n(P*(L-a)/L)} kN`,`M = R_{A}·a = ${n(P*a*(L-a)/L)} kN·m`]};},
r=>{const w=r.i(5,40,5),P=r.i(10,80,10),L=r.i(4,12,2);return{q:`Viga simple L=${L} m con w=${w} kN/m y P=${P} kN en el centro. Halla M máx.`,a:w*L*L/8+P*L/4,u:'kN·m',s:[`Superposición: wL²/8 + PL/4`,`= ${n(w*L*L/8)} + ${n(P*L/4)} = ${n(w*L*L/8+P*L/4)} kN·m`]};},

]});
SUB('flx',{t:'Esfuerzos por flexión',
lec:`Cuando una viga se dobla, sus fibras superiores se comprimen y las inferiores se estiran. En el centro hay una línea que no cambia: el **eje neutro**.

El esfuerzo crece linealmente con la distancia al eje neutro. Por eso el material lejano trabaja más, y por eso el perfil I es tan eficiente.

El **módulo de sección** S = I/c resume la eficiencia de la forma.

**Dato clave:** el concreto casi no resiste tensión, por eso se fisura abajo y necesita acero justo ahí.`,
key:['σ = [[M·c|I]] = [[M|S]]','S_{rect} = [[b·h^{2}|6]]','f_{r} = 2√{f\'_{c}}'],
err:'Unidades mezcladas: pasa M a kg·cm si I está en cm⁴.',
x:[['cen','I y c salen de la geometría'],['vac','En acero se diseña con S y Z'],['fle','En concreto se reemplaza por el bloque de Whitney']],
g:[
r=>{const b=r.i(15,40,5),h=r.i(30,80,5);return{q:`Calcula S de una viga ${b}×${h} cm.`,a:b*h*h/6,u:'cm³',s:[`S = bh²/6 = ${n(b*h*h/6,6)} cm³`]};},
r=>{const b=r.i(20,40,5),h=r.i(30,70,5),M=r.i(1,30);const s=M*1e5/(b*h*h/6);return{q:`Viga ${b}×${h} cm con M=${M} t·m. Halla σ máx.`,a:s,u:'kg/cm²',s:[`M = ${M*1e5} kg·cm`,`S = ${n(b*h*h/6)} cm³`,`σ = ${n(s)} kg/cm²`]};},
r=>{const b=r.i(20,40,5),h=r.i(30,70,5),fc=r.p([175,210,280,350]);const fr=2*sq(fc),Mc=fr*(b*h*h/6)/1e5;return{q:`Viga de ${b}×${h} cm con f'_{c}=${fc}. ¿Con qué momento se fisura (M_{cr}=f_{r}·S, f_{r}=2√f'_{c})?`,a:Mc,u:'t·m',s:[`f_{r} = ${n(fr)} kg/cm²`,`M_{cr} = ${n(Mc)} t·m`]};},
r=>{const w=r.i(1,4,.5),L=r.i(4,9),sad=r.p([100,110,120]),b=r.i(15,30,5);const M=w*L*L/8*1e5;const h=sq(6*M/(b*sad));return{q:`Viga de madera de ancho ${b} cm, L=${L} m, w=${w} t/m y σ_{adm}=${sad} kg/cm². Halla la altura mínima.`,a:h,u:'cm',s:[`M = wL²/8 = ${n(M/1e5)} t·m`,`h = √(6M/(bσ)) = ${n(h)} cm`]};},

SUB('cor',{t:'Esfuerzo cortante en vigas',
lec:`Apila hojas de papel y dóblalas: se deslizan entre sí. Si las pegas, la cola resiste ese deslizamiento. Ese es el **cortante**.

El esfuerzo es máximo en el eje neutro y cero en las fibras extremas, justo al revés que la flexión.

Para rectángulo: τ_{máx} = 1.5·V/A. En perfiles I, casi todo lo toma el alma: τ ≈ V/(h·t_{w}).

En concreto, el cortante produce fisuras inclinadas a 45°. Por eso se colocan **estribos**.`,
key:['τ = [[V·Q|I·b]]','τ_{rect} = [[3V|2A]]','τ_{circ} = [[4V|3A]]'],
err:'Calcular Q con el área total en vez del área arriba del punto.',
x:[['moh','Cortante y normal se combinan en el círculo de Mohr'],['cte','Los estribos resisten este cortante'],['vac','En acero se revisa el alma']],
g:[
r=>{const V=r.i(2,40,2),b=r.i(20,40,5),h=r.i(30,70,5);return{q:`Viga ${b}×${h} cm con V=${V} t. Halla τ máx.`,a:1.5*V*1000/(b*h),u:'kg/cm²',s:[`τ = 1.5V/A = ${n(1.5*V*1000/(b*h))} kg/cm²`]};},
r=>{const V=r.i(2,40,2),d=r.i(25,70,5);const A=PI*d*d/4;return{q:`Sección circular d=${d} cm con V=${V} t. Halla τ máx.`,a:4*V*1000/(3*A),u:'kg/cm²',s:[`τ = 4V/(3A) = ${n(4*V*1000/(3*A))} kg/cm²`]};},
r=>{const V=r.i(5,60,5),h=r.i(20,60,5),t=r.i(.6,1.4,.2);return{q:`Perfil I con alma ${h}×${t} cm, V=${V} t. Halla τ promedio en el alma.`,a:V*1000/(h*t),u:'kg/cm²',s:[`τ ≈ V/(h·t_{w}) = ${n(V*1000/(h*t))} kg/cm²`]};},
r=>{const V=r.i(2,30,2),b=r.i(20,40,5),h=r.i(30,70,5),y=r.i(5,10,5);const I=b*h**3/12;const Q=b*(h/2-y)*(h/2+y)/2;return{q:`Viga ${b}×${h} cm, V=${V} t. Halla τ a ${y} cm del eje neutro.`,a:V*1000*Q/(I*b),u:'kg/cm²',s:[`Q = b(h/2−y)(h/2+y)/2 = ${n(Q)} cm³`,`I = ${n(I,6)} cm⁴`,`τ = VQ/(Ib) = ${n(V*1000*Q/(I*b))} kg/cm²`]};},
r=>{const w=r.i(1,5,.5),L=r.i(4,9),b=r.i(20,35,5),h=r.i(40,70,5),vb=r.p([6,8,10]),s=r.i(10,25,5);const V=w*L/2,I=b*h**3/12,Q=b*h*h/8,q=V*1000*Q/I;return{q:`Viga armada de dos tablones ${b}×${h} cm (unión al centro), L=${L} m, w=${w} t/m. Si los pernos están cada ${s} cm, ¿qué fuerza lleva cada perno en el apoyo?`,a:q*s,u:'kg',s:[`V = wL/2 = ${n(V)} t`,`Flujo q = VQ/I = ${n(q)} kg/cm`,`F = q·s = ${n(q*s)} kg`]};}
]});
SUB('def',{t:'Deflexiones',
lec:`Una viga puede resistir sin romperse y aun así ser inútil: si se deforma mucho, se rajan tabiques y vibra incómodo. Por eso se limita la **flecha**.

Integrando dos veces EI·y″ = M obtienes la curva elástica. En la práctica se usan fórmulas de tablas y **superposición**.

Observa la potencia: la flecha crece con L⁴. Si duplicas la luz, se multiplica por 16. Por eso las luces grandes son caras.

Límites típicos: L/360 para sobrecarga con tabiques frágiles, L/240 en otros casos.`,
key:['δ = [[5wL^{4}|384EI]]','δ = [[PL^{3}|48EI]]','δ_{volado} = [[wL^{4}|8EI]]','δ_{volado} = [[PL^{3}|3EI]]'],
err:'Mezclar w en t/m con L en cm. Pasa todo a kg y cm.',
x:[['int','Es integrar dos veces'],['tvi','Trabajo virtual da el mismo resultado'],['los','Espesor mínimo de losas evita calcular flecha'],['hip','La compatibilidad de flechas resuelve vigas hiperestáticas']],
g:[
r=>{const I=r.i(50000,800000,50000),w=r.i(1,4,.5),L=r.i(3,8);const E=2.2e5;const d=5*(w*10)*(L*100)**4/(384*E*I);return{q:`Viga simple: w=${w} t/m, L=${L} m, E=220 000 kg/cm², I=${I} cm⁴. Halla la flecha.`,a:d,u:'cm',s:[`w = ${w*10} kg/cm`,`δ = 5wL⁴/(384EI) = ${n(d)} cm`]};},
r=>{const I=r.i(50000,800000,50000),P=r.i(1,10),L=r.i(3,8);const E=2.2e5;const d=P*1000*(L*100)**3/(48*E*I);return{q:`Viga simple: P=${P} t al centro, L=${L} m, E=220 000 kg/cm², I=${I} cm⁴. Halla δ.`,a:d,u:'cm',s:[`δ = PL³/(48EI) = ${n(d)} cm`]};},
r=>{const I=r.i(30000,300000,30000),P=r.i(1,5,.5),L=r.i(1,4,.5);const E=2.2e5;const d=P*1000*(L*100)**3/(3*E*I);return{q:`Voladizo: P=${P} t en punta, L=${L} m, E=220 000 kg/cm², I=${I} cm⁴. Halla δ.`,a:d,u:'cm',s:[`δ = PL³/(3EI) = ${n(d)} cm`]};},
r=>{const L=r.i(3,10),lim=r.p([240,360,480]);return{q:`Una viga de ${L} m tiene un límite de L/${lim}. ¿Qué flecha máxima se permite?`,a:L*1000/lim,u:'mm',s:[`δ = ${L*1000}/${lim} = ${n(L*1000/lim)} mm`]};},
r=>{const w=r.i(1,5,.5),L=r.i(4,9),b=r.i(20,35,5),fc=r.p([210,280]),lim=r.p([240,360]);const E=15000*sq(fc),Ireq=5*(w*10)*(L*100)**4/(384*E*(L*100/lim));const h=Math.cbrt(12*Ireq/b);return{q:`Para w=${w} t/m, L=${L} m, ancho ${b} cm, f'_{c}=${fc} y límite L/${lim} (sección bruta), halla la altura mínima.`,a:h,u:'cm',s:[`E = ${n(E,6)} kg/cm²`,`I requerida = 5wL⁴/(384Eδ) = ${n(Ireq,6)} cm⁴`,`h = ∛(12I/b) = ${n(h)} cm`]};}
]});
SUB('pan',{t:'Pandeo de columnas',
lec:`Comprime una regla con las manos. Antes de romperse, se dobla de golpe hacia un lado. Eso es **pandeo**: una falla por inestabilidad, no por falta de resistencia.

Euler demostró que depende de la rigidez y de la longitud al cuadrado. La forma de los apoyos cambia la longitud efectiva: K.

- Biarticulada: K = 1
- Empotrada-libre: K = 2
- Biempotrada: K = 0.5
- Empotrada-articulada: K = 0.7

**La esbeltez** KL/r es el dato que importa. Siempre revisa el eje débil.`,
key:['P_{cr} = [[π^{2}EI|(KL)^{2}]]','r = √{[[I|A]]}','σ_{cr} = [[π^{2}E|(KL/r)^{2}]]'],
err:'Revisar el eje fuerte. La columna siempre pandea hacia donde es más débil.',
x:[['com','El diseño AISC parte de Euler'],['col','La esbeltez amplifica momentos en concreto'],['osc','Mayor rigidez, mayor capacidad']],
g:[
r=>{const I=r.i(1000,20000,1000),A=r.i(30,200,10);return{q:`Con I=${I} cm⁴ y A=${A} cm², halla r.`,a:sq(I/A),u:'cm',s:[`r = √(I/A) = ${n(sq(I/A))} cm`]};},
r=>{const L=r.i(2,9,.5),K=r.p([.5,.7,1,2]),rr=r.i(2,12,.5);return{q:`Columna con L=${L} m, K=${K}, r=${rr} cm. Halla la esbeltez KL/r.`,a:K*L*100/rr,u:'',s:[`KL/r = ${K}·${L*100}/${rr} = ${n(K*L*100/rr)}`]};},
r=>{const I=r.i(1000,20000,500),L=r.i(2,8,.5),K=r.p([.5,.7,1,2]);const P=PI*PI*2e6*I/(K*L*100)**2/1000;return{q:`Columna de acero: I=${I} cm⁴, L=${L} m, K=${K}. Halla P_{cr} de Euler.`,a:P,u:'t',s:[`P_{cr} = π²EI/(KL)²`,`= ${n(P)} t`]};},
r=>{const b=r.i(5,15,1),h=r.i(16,40,2),L=r.i(2,5,.5);const I=h*b**3/12;const P=PI*PI*1e5*I/(L*100)**2/1000;return{q:`Puntal de madera ${b}×${h} cm, E=100 000 kg/cm², biarticulado, L=${L} m. Halla P_{cr}.`,a:P,u:'t',s:[`Eje débil: I = ${h}·${b}³/12 = ${n(I)} cm⁴`,`P_{cr} = ${n(P)} t`]};},
r=>{const K1=r.p([.5,.65,.7,.8,1,1.2,2]),K2=r.p([.5,.65,.7,.8,1,1.2,2]),P=r.i(20,200,10);const a=P*(K1/K2)**2;return{q:`Una columna con K=${K1} tiene P_{cr}=${P} t. Si sus apoyos cambian a K=${K2}, ¿cuál es el nuevo P_{cr}?`,a,u:'t',s:[`P_{cr} ∝ 1/K²`,`P′ = ${P}(${K1}/${K2})² = ${n(a)} t`]};}
]});
SUB('moh',{t:'Esfuerzos combinados y Mohr',
lec:`En un mismo punto hay esfuerzo normal y cortante. Al girar el elemento de análisis, los valores cambian. El **círculo de Mohr** es la forma gráfica de verlos todos.

- Los puntos sobre el eje horizontal son los **esfuerzos principales**: sin cortante.
- El radio es el cortante máximo.
- Una fisura en concreto se abre perpendicular al esfuerzo principal de tensión.

**Sorpresa útil:** el mismo círculo describe la falla de suelos. Una herramienta de estructuras reaparece en geotecnia.`,
key:['σ_{prom} = [[σ_{x}+σ_{y}|2]]','R = √{([[σ_{x}−σ_{y}|2]])^{2} + τ^{2}}','σ_{1,2} = σ_{prom} ± R'],fig:'mohr',
err:'Olvidar que en el círculo los ángulos valen el doble (2θ).',
x:[['res','El criterio de Mohr-Coulomb usa el mismo círculo'],['cte','Las fisuras a 45° aparecen por tensión principal']],
g:[
r=>{const sx=r.i(20,200,10),sy=r.i(0,100,10);return{q:`σ_{x}=${sx}, σ_{y}=${sy} kg/cm². Halla σ_{prom}.`,a:(sx+sy)/2,u:'kg/cm²',s:[`σ_{prom} = ${(sx+sy)/2}`]};},
r=>{const sx=r.i(40,200,10),sy=r.i(0,60,10),t=r.i(10,80,5);const R=sq(((sx-sy)/2)**2+t*t);return{q:`σ_{x}=${sx}, σ_{y}=${sy}, τ=${t} kg/cm². Halla el radio de Mohr.`,a:R,u:'kg/cm²',s:[`R = √(${(sx-sy)/2}² + ${t}²) = ${n(R)}`]};},
r=>{const sx=r.i(40,200,10),sy=r.i(0,60,10),t=r.i(10,80,5);const R=sq(((sx-sy)/2)**2+t*t);return{q:`σ_{x}=${sx}, σ_{y}=${sy}, τ=${t} kg/cm². Halla σ₁.`,a:(sx+sy)/2+R,u:'kg/cm²',s:[`σ₁ = σ_{prom} + R = ${(sx+sy)/2} + ${n(R)} = ${n((sx+sy)/2+R)}`]};},
r=>{const sx=r.i(40,200,10),sy=r.i(0,60,10),t=r.i(10,80,5);const a=.5*Math.atan2(2*t,sx-sy)*180/PI;return{q:`σ_{x}=${sx}, σ_{y}=${sy}, τ=${t} kg/cm². Halla el ángulo del plano principal θ_{p}.`,a,u:'°',s:[`tan 2θ = 2τ/(σ_{x}−σ_{y}) = ${n(2*t/(sx-sy))}`,`θ_{p} = ${n(a)}°`]};},
r=>{const M=r.i(2,15),V=r.i(2,15),b=r.i(20,35,5),h=r.i(40,70,5),y=r.i(10,15,5);const I=b*h**3/12,s=M*1e5*y/I,Q=b*(h/2-y)*(h/2+y)/2,t=V*1000*Q/(I*b),s1=s/2+sq((s/2)**2+t*t);return{q:`Viga ${b}×${h} cm con M=${M} t·m y V=${V} t. A ${y} cm bajo el eje neutro, halla el esfuerzo principal de tensión.`,a:s1,u:'kg/cm²',s:[`σ = My/I = ${n(s)} kg/cm²`,`τ = VQ/(Ib) = ${n(t)} kg/cm²`,`σ₁ = σ/2 + √((σ/2)²+τ²) = ${n(s1)} kg/cm²`]};}
]});

SUB('agr',{t:'Agregados y granulometría',
lec:`El 70 % del concreto son piedras y arena. Una buena mezcla tiene tamaños variados para que los pequeños llenen huecos. Se mide con un tamizado.

**Módulo de finura (MF):** suma de los % retenidos acumulados en los tamices estándar (N.° 4, 8, 16, 30, 50, 100) entre 100. Para arena: 2.3 a 3.1.

**Humedad:** la arena en obra trae agua. Si no la descuentas, tu mezcla tendrá más agua de la calculada y menos resistencia.

**Peso unitario:** un m³ suelto pesa menos que uno compactado, por los vacíos.`,
key:['MF = [[Σ% ret. acum.|100]]','w = [[P_{húmedo} − P_{seco}|P_{seco}]]','Agua libre = P_{seco}(w − abs)'],
err:'Sumar los retenidos parciales en lugar de los acumulados.',
x:[['mez','MF y humedad entran al diseño de mezclas'],['cla','La granulometría también clasifica suelos']],
g:[
r=>{const p=[r.i(0,5),r.i(8,15),r.i(20,30),r.i(45,60),r.i(70,82),r.i(90,98)];const s=p.reduce((a,b)=>a+b);return{q:`Retenidos acumulados: ${p.join(', ')} %. Halla el MF.`,a:s/100,u:'',s:[`Σ = ${s}`,`MF = ${n(s/100)}`]};},
r=>{const ph=r.i(500,2000,50),w=r.i(1,9,.5);const ps=ph/(1+w/100);return{q:`Una muestra húmeda pesa ${ph} g con humedad ${w} %. ¿Cuánto pesa seca?`,a:ps,u:'g',s:[`P_{seco} = P_{húmedo}/(1+w) = ${n(ps)} g`]};},
r=>{const ph=r.i(500,2000,50),ps=ph-r.i(10,120,5);return{q:`Una muestra pesa ${ph} g húmeda y ${ps} g seca. Halla la humedad.`,a:(ph-ps)/ps*100,u:'%',s:[`w = (${ph}−${ps})/${ps} = ${n((ph-ps)/ps*100)} %`]};},
r=>{const A=r.i(600,900,10),w=r.i(2,8,.5),ab=r.i(.5,2,.25);const lib=A*(w-ab)/100;return{q:`Se usan ${A} kg de arena seca con humedad ${w} % y absorción ${ab} %. ¿Cuánta agua aporta?`,a:lib,u:'L',s:[`Agua libre = A(w−abs) = ${n(lib)} L`,`Debes restarla del agua de la mezcla`]};},
r=>{const x=r.i(30,70,5),m1=r.i(2.4,2.9,.05),m2=r.i(2.9,3.4,.05);const mm=x/100*m1+(1-x/100)*m2;return{q:`Combinas ${x} % de arena A (MF=${n(m1)}) con ${100-x} % de arena B (MF=${n(m2)}). Halla el MF de la mezcla.`,a:mm,u:'',s:[`MF = ${x/100}·${n(m1)} + ${(100-x)/100}·${n(m2)} = ${n(mm)}`]};}
]});
SUB('mez',{t:'Diseño de mezclas de concreto',
lec:`Diseñar una mezcla es elegir proporciones. La regla de oro la descubrió Abrams: **a menos agua respecto del cemento (a/c), mayor resistencia**.

## Método ACI 211, resumido
- Calcula f'_{cr} según el control de obra
- Elige a/c para esa resistencia: 210→0.68, 280→0.57, 350→0.48 (referencial, sin aire)
- Agua según el asentamiento y tamaño de piedra, cerca de 190 a 205 L/m³
- Cemento = agua / (a/c)
- Calcula volúmenes absolutos: la suma debe dar 1 m³

Peso específico: cemento 3.15, agua 1, agregados cerca de 2.65.

**Nunca agregues agua a la mezcla en obra para hacerla más trabajable:** usa aditivo.`,
key:['C = [[A|a/c]]','V = [[C|3150]] + [[A|1000]] + [[P|γ]] + aire = 1 m^{3}'],
err:'Confundir volumen absoluto con volumen aparente del agregado.',
x:[['est','f\'cr viene del control estadístico'],['agr','La humedad corrige el agua'],['apu','El cemento por m³ define el costo']],
g:[
r=>{const A=r.i(170,220,5),ac=r.p([.45,.5,.55,.6,.65,.7]);return{q:`Con ${A} L/m³ de agua y a/c=${ac}, ¿cuánto cemento?`,a:A/ac,u:'kg/m³',s:[`C = ${A}/${ac} = ${n(A/ac)} kg/m³`]};},
r=>{const A=r.i(170,220,5),ac=r.p([.45,.5,.55,.6,.65,.7]);return{q:`Con ${A} L/m³ y a/c=${ac}, ¿cuántas bolsas de cemento por m³?`,a:A/ac/42.5,u:'bolsas',s:[`C = ${n(A/ac)} kg`,`Bolsas = C/42.5 = ${n(A/ac/42.5)}`]};},
r=>{const C=r.i(280,450,10);return{q:`¿Qué volumen absoluto ocupan ${C} kg de cemento (densidad 3150 kg/m³)?`,a:C/3150,u:'m³',s:[`V = ${C}/3150 = ${n(C/3150)} m³`]};},
r=>{const A=r.i(180,210,5),ac=r.p([.5,.55,.6]),g=r.i(900,1050,10),air=r.p([.01,.015,.02]);const C=A/ac;const Vf=1-C/3150-A/1000-g/2700-air;return{q:`Mezcla: A=${A} L, a/c=${ac}, piedra=${g} kg (2700 kg/m³), aire ${air*100} %. Halla la arena (2650 kg/m³) en kg/m³.`,a:Vf*2650,u:'kg/m³',s:[`C = ${n(C)} kg → ${n(C/3150)} m³`,`Agua ${n(A/1000)} m³; piedra ${n(g/2700)} m³; aire ${air} m³`,`V arena = ${n(Vf)} m³`,`Arena = ${n(Vf*2650)} kg`]};},
r=>{const A=r.i(180,210,5),ar=r.i(700,850,10),w=r.i(3,8,.5),ab=r.i(1,2,.5),g=r.i(950,1050,10),wg=r.i(.5,2,.5),abg=r.i(1,2,.5);const c=A-ar*(w-ab)/100-g*(wg-abg)/100;return{q:`Agua de diseño ${A} L. Arena ${ar} kg (w=${w} %, abs=${ab} %), piedra ${g} kg (w=${wg} %, abs=${abg} %). Halla el agua corregida a usar en obra.`,a:c,u:'L',s:[`Aporte arena: ${n(ar*(w-ab)/100)} L`,`Aporte piedra: ${n(g*(wg-abg)/100)} L`,`Agua = ${n(c)} L`]};}
]});
SUB('ref',{t:'Acero de refuerzo',
lec:`El concreto resiste compresión y el acero tensión. En Perú se usa acero grado 60: **f_{y} = 4200 kg/cm²**.

Las varillas se nombran por diámetro en octavos de pulgada:

- 3/8": 0.71 cm², 0.56 kg/m
- 1/2": 1.29 cm², 0.99 kg/m
- 5/8": 2.00 cm², 1.55 kg/m
- 3/4": 2.84 cm², 2.24 kg/m
- 1": 5.10 cm², 3.97 kg/m

SUB('niv',{t:'Nivelación',
lec:`La nivelación mide diferencias de altura. Con un nivel y una mira:

- **Vista atrás (+):** la lectura sobre un punto de cota conocida
- **Vista adelante (−):** la lectura sobre el punto buscado

La altura del instrumento es AI = cota + vista atrás. Y la nueva cota = AI − vista adelante.

Al cerrar el circuito, el error debe ser pequeño. Se compensa repartiéndolo según la distancia.`,
key:['AI = Cota + V_{atrás}','Cota = AI − V_{adelante}','e_{máx} = 12√{K} mm'],
err:'Sumar la vista adelante en vez de restarla.',

g:[

r=>{const c=r.i(100,3800,1),va=r.i(.5,3,.01);return{q:`Cota ${c} m y vista atrás ${va} m. Halla la altura del instrumento.`,a:c+va,u:'m',tol:.0005,s:[`AI = ${n(c+va,7)} m`]};},
r=>{const c=r.i(100,3000,1),v=[r.i(1,3,.01),r.i(1,3,.01),r.i(1,3,.01)],d=[r.i(.5,3,.01),r.i(.5,3,.01),r.i(.5,3,.01)];const a=c+v[0]+v[1]+v[2]-d[0]-d[1]-d[2];return{q:`Cota inicial ${c} m. Vistas atrás: ${v.join(', ')}. Vistas adelante: ${d.join(', ')}. Halla la cota final.`,a,u:'m',tol:.0005,s:[`Σatrás = ${n(v[0]+v[1]+v[2],5)}`,`Σadelante = ${n(d[0]+d[1]+d[2],5)}`,`Final = ${n(a,7)} m`]};},
r=>{const K=r.i(.5,9,.5);return{q:`Circuito de ${K} km. Halla el error máximo con e=12√K mm.`,a:12*sq(K),u:'mm',s:[`e = 12√${K} = ${n(12*sq(K))} mm`]};},

]});
SUB('pol',{t:'Poligonales y coordenadas',
lec:`Una poligonal es una cadena de puntos medidos con ángulos y distancias. Con el **azimut** (ángulo desde el norte, sentido horario) calculas coordenadas:

- Δx (Este) = d·sen Az
- Δy (Norte) = d·cos Az

**Cuidado:** coseno va con Norte, al revés que en matemática, porque el ángulo se mide desde el norte.

La suma de ángulos interiores debe ser 180°(n−2). El error de cierre se compensa con Bowditch, proporcional a la longitud.`,
key:['ΔE = d·sen Az','ΔN = d·cos Az','Σ∠_{int} = 180°(n−2)','Precisión = [[e|Σd]]'],
err:'Usar coseno para el Este por costumbre.',
x:[['tri','Es trigonometría aplicada'],['are','Con coordenadas se calcula el área'],['hor','El trazo de la vía sigue estos azimuts']],
g:[
r=>{const nn=r.i(3,20);return{q:`Polígono de ${nn} lados. ¿Cuánto suman los ángulos interiores?`,a:180*(nn-2),u:'°',s:[`180(${nn}−2) = ${180*(nn-2)}°`]};},
r=>{const d=r.i(50,500,10),Az=r.i(10,350,5);return{q:`Línea de ${d} m con azimut ${Az}°. Halla ΔE.`,a:d*sind(Az),u:'m',s:[`ΔE = ${d}·sen ${Az}° = ${n(d*sind(Az))} m`]};},
r=>{const e=r.i(100,2000,50),nn=r.i(100,2000,50),d=r.i(50,300,10),Az=r.i(10,350,5);return{q:`Desde (E=${e}, N=${nn}) se avanza ${d} m a Az=${Az}°. Halla la nueva N.`,a:nn+d*cosd(Az),u:'m',s:[`ΔN = ${n(d*cosd(Az))} m`,`N = ${n(nn+d*cosd(Az),6)} m`]};},
r=>{const dE=r.i(-200,200,10)||50,dN=r.i(-200,200,10)||50;let Az=Math.atan2(dE,dN)*180/PI;if(Az<0)Az+=360;return{q:`Dos puntos difieren en ΔE=${dE} m y ΔN=${dN} m. Halla el azimut.`,a:Az,u:'°',s:[`Az = atan2(ΔE, ΔN) = ${n(Az)}°`,`Si sale negativo, suma 360°`]};},
r=>{const eE=r.i(5,30,1)/100,eN=r.i(5,30,1)/100,P=r.i(600,3000,100);const e=sq(eE*eE+eN*eN);return{q:`Poligonal de ${P} m cierra con e_{E}=${eE} m, e_{N}=${eN} m. Halla la precisión como 1/x; escribe x.`,a:P/e,u:'',s:[`Error lineal = ${n(e)} m`,`x = ${P}/${n(e)} = ${n(P/e,5)}`]};}
]});
SUB('are',{t:'Áreas y movimiento de tierras',
lec:`Con coordenadas calculas el área de cualquier lote con la **fórmula de Gauss** o de los zapatos.

Para tierra, se usan **secciones transversales** a lo largo de la vía. El volumen entre dos secciones es su promedio por la distancia.

## Factor de esponjamiento
Un m³ excavado ocupa más al estar suelto. Si no lo consideras, faltarán volquetes en tu presupuesto. En cambio, al compactarlo ocupa menos.`,
key:['A = ½|Σ(x_{i}y_{i+1} − x_{i+1}y_{i})|','V = L·[[A_{1}+A_{2}|2]]','V_{suelto} = V_{banco}(1 + e)'],
err:'Usar volumen en banco para calcular volquetes.',
x:[['met','Los volúmenes entran al metrado'],['num','Trapecio y Simpson son lo mismo'],['cpt','La compactación cambia el volumen']],
g:[
r=>{const A1=r.i(5,60),A2=r.i(5,60),L=r.i(10,40,5);return{q:`Secciones de ${A1} y ${A2} m² separadas ${L} m. Halla el volumen.`,a:L*(A1+A2)/2,u:'m³',s:[`V = ${L}·(${A1}+${A2})/2 = ${n(L*(A1+A2)/2)} m³`]};},
r=>{const V=r.i(100,5000,50),e=r.p([.15,.2,.25,.3,.4]);return{q:`Se excavan ${V} m³ en banco con esponjamiento ${e*100} %. ¿Qué volumen suelto?`,a:V*(1+e),u:'m³',s:[`V_{s} = ${n(V*(1+e))} m³`]};},
r=>{const a=r.i(10,60,5),b=r.i(10,60,5),c=r.i(5,50,5);const A=.5*Math.abs(0*0-a*0+a*b-c*0+c*0-0*b);return{q:`Lote triangular con vértices (0,0), (${a},0) y (${c},${b}) m. Halla el área.`,a:a*b/2,u:'m²',s:[`Gauss: ½|x₁y₂−x₂y₁ + x₂y₃−x₃y₂ + x₃y₁−x₁y₃|`,`= ½·${a}·${b} = ${n(a*b/2)} m²`]};},
r=>{const a=r.i(20,60,5),b=r.i(20,50,5),c=r.i(5,15,5),d=r.i(25,50,5);const P=[[0,0],[a,0],[a+c,b],[0,d]];let s=0;for(let i=0;i<4;i++){const j=(i+1)%4;s+=P[i][0]*P[j][1]-P[j][0]*P[i][1];}return{q:`Lote con vértices (0,0), (${a},0), (${a+c},${b}), (0,${d}) m. Halla el área.`,a:Math.abs(s)/2,u:'m²',s:[`Suma de productos cruzados = ${s}`,`A = ${n(Math.abs(s)/2)} m²`]};},
r=>{const V=r.i(500,6000,100),e=r.p([.2,.25,.3]),q=r.p([10,15,20]),c=r.p([180,220,260]);const viajes=Math.ceil(V*(1+e)/q);return{q:`Se excavan ${V} m³ con esponjamiento ${e*100} %, volquetes de ${q} m³ y S/${c} por viaje. Halla el costo total (viajes completos).`,a:viajes*c,u:'S/',s:[`Suelto = ${n(V*(1+e))} m³`,`Viajes = ${viajes}`,`Costo = S/ ${viajes*c}`]};}
]});

SUB('car',{t:'Metrado de cargas (E.020)',
lec:`Metrar es seguir la ruta de la carga: **losa → viga → columna → zapata → suelo**. Cada elemento recibe lo que le llega por su ancho tributario.

## Carga muerta (CM)
Lo permanente. Concreto armado 2400 kg/m³, albañilería 1800 kg/m³, aligerado de 20 cm: 300 kg/m², piso terminado: 100 kg/m².

## Carga viva (CV), E.020
- Vivienda: 200 kg/m²
- Oficinas y aulas: 250 kg/m²
- Corredores y escaleras: desde 200 kg/m² y hasta 400 según el uso
- Tiendas: 500 kg/m²
- Techo: 100 kg/m²

**Regla rápida para predimensionar:** un edificio de concreto pesa cerca de 1 t/m² por piso.`,
key:['w = (q_{CM} + q_{CV})·a_{trib}','P_{col} = q·A_{trib}·N_{pisos}','w_{viga propia} = 2400·b·h'],fig:'tributaria',
err:'Olvidar el peso propio de la viga y de la columna.',
x:[['vm','w entra a los diagramas'],['fle','Con la carga amplificada se diseña'],['zap','La suma por pisos carga a la zapata'],['esp','El peso total P entra a V sísmico']],
g:[
r=>{const b=r.i(20,40,5),h=r.i(40,80,5);return{q:`Viga de ${b}×${h} cm. Halla el peso propio.`,a:2400*b*h/1e4,u:'kg/m',s:[`w = 2400·${b/100}·${h/100} = ${n(2400*b*h/1e4)} kg/m`]};},
r=>{const q=r.i(300,800,50),a=r.i(2,7,.5);return{q:`Una losa de ${q} kg/m² descarga en una viga con ancho tributario ${a} m. Halla w.`,a:q*a,u:'kg/m',s:[`w = ${q}·${a} = ${n(q*a)} kg/m`]};},
r=>{const al=r.p([280,300,350]),pt=100,ta=r.p([100,150]),a=r.i(3,6,.5),b=r.i(25,30,5),h=r.i(50,70,5);const w=(al+pt+ta)*a+2400*b*h/1e4;return{q:`Viga ${b}×${h} cm con ancho tributario ${a} m. Aligerado ${al}, piso ${pt}, tabiquería ${ta} kg/m². Halla la CM total en kg/m.`,a:w,u:'kg/m',s:[`Losa: ${(al+pt+ta)}·${a} = ${n((al+pt+ta)*a)}`,`Viga: ${n(2400*b*h/1e4)}`,`CM = ${n(w)} kg/m`]};},

SUB('det',{t:'Estabilidad e indeterminación',
lec:`Una estructura **isostática** se resuelve solo con equilibrio. Una **hiperestática** tiene más incógnitas que ecuaciones, y necesita compatibilidad de deformaciones.

Los edificios son hiperestáticos a propósito: si un elemento cede, la carga busca otro camino. Esa es la **redundancia** que salva vidas en un sismo.

## Conteo
- Viga: GH = r − 3 − c (c = articulaciones internas)
- Pórtico plano: GH = 3b + r − 3n − c
- Armadura plana: GH = b + r − 2n

GH < 0 es un mecanismo inestable.`,
key:['GH_{viga} = r − 3 − c','GH_{pórtico} = 3b + r − 3n − c','GH_{armadura} = b + r − 2n'],
err:'Contar mal las reacciones de un empotramiento, que son 3.',
x:[['arm','Misma fórmula de armaduras'],['hip','Los redundantes se resuelven con compatibilidad'],['rig','El método de rigidez usa grados de libertad']],
g:[
r=>{const c=r.i(1,14);return{q:`Viga continua de ${c+1} tramos sobre ${c+2} apoyos: uno fijo (2 reacciones) y el resto móviles. Halla GH.`,a:c,u:'',s:[`r = 2 + ${c+1} = ${c+3}`,`GH = r − 3 = ${c}`]};},
r=>{const nn=r.i(6,14),b=r.i(2*nn-5,2*nn+2);return{q:`Armadura plana: b=${b} barras, r=3, n=${nn}. Halla GH.`,a:b+3-2*nn,u:'',s:[`GH = ${b} + 3 − ${2*nn} = ${b+3-2*nn}`]};},
r=>{const col=r.i(2,15);return{q:`Pórtico de un piso con ${col} columnas empotradas en la base y ${col-1} vigas. Halla GH.`,a:3*(col-1),u:'',s:[`b = ${2*col-1}, n = ${2*col}, r = ${3*col}`,`GH = 3b + r − 3n = ${3*(col-1)}`]};},
r=>{const p=r.i(2,8),v=r.i(1,5);const cols=v+1;const b=p*cols+p*v,nn=(p+1)*cols,rr=3*cols;return{q:`Pórtico de ${p} pisos y ${v} vanos, empotrado. Halla GH.`,a:3*b+rr-3*nn,u:'',s:[`b = ${b}, n = ${nn}, r = ${rr}`,`GH = 3b+r−3n = ${3*b+rr-3*nn}`,`Atajo: 3·pisos·vanos = ${3*p*v}`]};},
r=>{const p=r.i(2,8),v=r.i(1,5),c=r.i(1,4);const cols=v+1;const b=p*cols+p*v,nn=(p+1)*cols,rr=3*cols;return{q:`Pórtico de ${p} pisos y ${v} vanos con ${c} rótulas plásticas ya formadas. ¿Cuántas rótulas adicionales puede admitir antes de ser un mecanismo? (Rótulas totales = GH+1)`,a:3*b+rr-3*nn+1-c,u:'rótulas',s:[`GH inicial = ${3*p*v}`,`Colapso con GH+1 = ${3*p*v+1}`,`Faltan ${3*p*v+1-c}`]};}
]});
SUB('tvi',{t:'Trabajo virtual',
lec:`Para hallar la flecha en un punto: aplica ahí una **carga ficticia de 1**, calcula sus fuerzas internas n y m, y multiplícalas por las reales.

- Armaduras: δ = Σ N·n·L/(A·E)
- Vigas: δ = ∫M·m dx/(E·I)

La integral tiene atajos tabulados: triángulo × triángulo = ⅓·M·m·L.

**Ventaja:** permite elegir exactamente qué punto y dirección quieres medir, y es la base del método de las fuerzas.`,
key:['δ = Σ[[N·n·L|A·E]]','δ = ∫[[M·m|E·I]]dx','Triángulo·Triángulo = ⅓·M·m·L'],
err:'Olvidar el signo de n en barras a compresión.',
x:[['ene','Es conservación de energía'],['def','Compara con las fórmulas de tabla'],['hip','Los coeficientes de flexibilidad salen de aquí']],
g:[
r=>{const P=r.i(2,20),L=r.i(1,5),A=r.i(5,30);const d=P*1000*L*100/(A*2e6);return{q:`Barra de acero con N=${P} t, n=1, L=${L} m, A=${A} cm². Halla δ.`,a:d,u:'cm',s:[`δ = NnL/AE = ${n(d)} cm`]};},
r=>{const M=r.i(5,50,5),m=r.i(1,4),L=r.i(2,8);return{q:`Diagramas triangulares con máximos M=${M} kN·m y m=${m} m sobre ${L} m. Halla ∫M·m dx.`,a:M*m*L/3,u:'kN·m³',s:[`⅓·${M}·${m}·${L} = ${n(M*m*L/3)}`]};},
r=>{const P=r.i(1,10),L=r.i(2,5),EI=r.i(2000,20000,1000);const d=P*L**3/(3*EI)*1000;return{q:`Voladizo con P=${P} kN, L=${L} m, EI=${EI} kN·m². Con m=x y M=Px, halla δ en la punta.`,a:d,u:'mm',s:[`δ = ⅓·(PL)·L·L/EI`,`δ = ${n(d)} mm`]};},
r=>{const w=r.i(5,30,5),L=r.i(4,10),EI=r.i(10000,60000,5000);const d=w*L**3/(24*EI);return{q:`Viga simple: w=${w} kN/m, L=${L} m, EI=${EI} kN·m². Halla el giro en el apoyo (θ=wL³/24EI), en rad.`,a:d,u:'rad',tol:.02,s:[`θ = ${n(d)} rad`]};},
r=>{const P=r.i(10,60,5),t=r.i(30,60,5),A=r.i(5,25),h=r.i(2,5);const L=h/sind(t);const N=P/(2*sind(t));const d=2*N*(1/(2*sind(t)))*L*100*1000/(A*2e6)*10;return{q:`Dos barras iguales forman un triángulo invertido: P=${P} t abajo, inclinación ${t}°, altura ${h} m, A=${A} cm². Halla el descenso del nudo en mm.`,a:d,u:'mm',s:[`Cada barra: L = ${n(L)} m, N = ${n(N)} t, n = ${n(1/(2*sind(t)))}`,`δ = 2·N·n·L/(AE) = ${n(d)} mm`]};}
]});
SUB('hip',{t:'Vigas hiperestáticas',
lec:`Método de las fuerzas: quita un apoyo sobrante, calcula cuánto se movería ese punto y halla la fuerza que lo devuelve a cero. Es **compatibilidad de deformaciones**.

## Resultados que usarás mucho
- Empotrada-simple con w: reacción simple = 3wL/8, momento en empotre = wL²/8
- Biempotrada con w: momentos = wL²/12 en apoyos y wL²/24 en centro
- Dos tramos iguales con w: momento central = wL²/8, reacción central = 5wL/4

SUB('crs',{t:'Método de Cross',
lec:`Hardy Cross ideó un método genial: **bloquea** los nudos, reparte el desequilibrio, y **transmite** la mitad al otro extremo. Repite hasta que no cambie.

## Pasos
- Rigidez: k = 4EI/L, o 3EI/L si el otro extremo es articulado
- Factor de distribución: FD = k/Σk en el nudo
- Momentos de empotramiento perfecto (FEM)
- Reparte el desbalance, transmite ½, repite

**Imagen:** un nudo con varias barras es como una familia repartiendo un gasto: paga más quien gana más, es decir, el más rígido.`,

SUB('rig',{t:'Método matricial de rigidez',

SUB('fle',{t:'Flexión en vigas',

## El bloque de Whitney
En rotura, el concreto comprimido se reemplaza por un rectángulo de esfuerzo 0.85f'_{c} y altura a. El acero fluye a f_{y}. Equilibrio T = C:

As·fy = 0.85·f'c·b·a

## Límites
- **A_{s,mín}** evita la falla frágil apenas se fisura.
- **ρ_{máx} = 0.75ρ_{b}** garantiza que el acero fluya primero. Queremos que la viga avise antes de caer.

β₁ = 0.85 para f'_{c} ≤ 280 kg/cm², baja 0.05 cada 70 kg/cm².`,

SUB('cte',{t:'Cortante y estribos',
lec:`El cortante rompe sin avisar, en diagonal. Por eso se diseña para que nunca falle antes que la flexión. Usa **φ = 0.85**.

SUB('col',{t:'Columnas',
lec:`Las columnas son lo último que debe fallar. E.060 usa φ = 0.70 para columnas con estribos y 0.75 con espiral, porque la falla es frágil y el daño sería colosal.

SUB('los',{t:'Losas aligeradas',
lec:`En Perú, el piso más común es el **aligerado**: viguetas de 10 cm cada 40 cm, con ladrillos de techo en medio y losa de 5 cm arriba. Es liviano y barato.

## Espesor (regla práctica)
h ≈ L/25. Usa 17, 20, 25 o 30 cm.

## Por vigueta
Cada vigueta toma un ancho de 40 cm. Se diseña como viga T para momento positivo, y como viga rectangular de 10 cm para el negativo.

## Coeficientes ACI para tramos continuos
- Apoyo interior: wL²/9 o wL²/10
- Tramo extremo: wL²/14
- Tramo interior: wL²/16

Si el cortante no alcanza, se **ensancha** la vigueta retirando ladrillos cerca del apoyo. E.060 permite 1.1V_{c}.`,

SUB('com',{t:'Acero a compresión',

- Si KL/r ≤ 4.71√(E/F_{y}): columna inelástica, F_{cr} = 0.658^{F_{y}/F_{e}}·F_{y}
- Si no: columna elástica, F_{cr} = 0.877·F_{e}

Se recomienda KL/r ≤ 200. E = 2 040 000 kg/cm².`,
key:['F_{e} = [[π^{2}E|(KL/r)^{2}]]','F_{cr} = 0.658^{F_{y}/F_{e}}·F_{y}','F_{cr} = 0.877·F_{e}','φP_{n} = 0.90·F_{cr}·A_{g}'],
err:'Usar el r mayor. Gobierna la esbeltez mayor, es decir el r menor.',
x:[['pan','Base en Euler'],['arm','Las cuerdas superiores se comprimen'],['esp','Los arriostres resisten sismo']],
g:[
r=>{const K=r.p([.65,.8,1,1.2,2]),L=r.i(2,8,.5),rr=r.i(2,10,.5);return{q:`K=${K}, L=${L} m, r=${rr} cm. Halla KL/r.`,a:K*L*100/rr,u:'',s:[`= ${n(K*L*100/rr)}`]};},
r=>{const s=r.i(40,180,5);const Fe=PI*PI*2.04e6/s**2;return{q:`Con KL/r=${s}, halla F_{e}.`,a:Fe,u:'kg/cm²',s:[`F_{e} = π²·2 040 000/${s}² = ${n(Fe)} kg/cm²`]};},
r=>{const Fy=r.p([2320,2530,2800,3160,3515,3870,4220,4570,4920,5270,6330,7030]);return{q:`Para F_{y}=${Fy} kg/cm², halla el límite 4.71√(E/F_{y}).`,a:4.71*sq(2.04e6/Fy),u:'',s:[`= ${n(4.71*sq(2.04e6/Fy))}`]};},
r=>{const s=r.i(40,120,5),Fy=r.p([2530,3515]);const Fe=PI*PI*2.04e6/s**2,lim=4.71*sq(2.04e6/Fy),Fc=s<=lim?.658**(Fy/Fe)*Fy:.877*Fe;return{q:`KL/r=${s}, F_{y}=${Fy}. Halla F_{cr}.`,a:Fc,u:'kg/cm²',s:[`F_{e} = ${n(Fe)} kg/cm²; límite = ${n(lim)}`,s<=lim?`Inelástica: F_{cr} = 0.658^{F_{y}/F_{e}}·F_{y}`:`Elástica: F_{cr} = 0.877F_{e}`,`F_{cr} = ${n(Fc)} kg/cm²`]};},

]});
SUB('vac',{t:'Vigas de acero',
lec:`El acero puede plastificar toda la sección. Se usa el módulo plástico Z, que es mayor que S. Si el perfil es compacto y arriostrado:

Para rectángulo Z = bh²/4 frente a S = bh²/6; la razón Z/S se llama factor de forma, y en perfiles I vale cerca de 1.12.

El ala comprimida puede pandear lateralmente si no se arriostra: por eso se colocan correas y tensores.

Cortante: φV_{n} = 1.0·0.6·F_{y}·A_{w}.`,

SUB('alb',{t:'Albañilería confinada',
lec:`La mayoría de viviendas peruanas son de ladrillo con columnas y vigas de amarre. La E.070 exige que el muro resista por sí mismo.

## Densidad de muros
En cada dirección: ΣL·t/A_{p} ≥ Z·U·S·N/56. Es la primera revisión que hace un ingeniero, y puede hacerse a mano.

## Esfuerzo axial
σ_{m} ≤ 0.2f'_{m}[1 − (h/35t)²] y además σ_{m} ≤ 0.15f'_{m}.

## Resistencia al corte
V_{m} = 0.5·v'_{m}·α·t·L + 0.23·P_{g}. Ladrillo King Kong industrial: f'_{m} ≈ 65 kg/cm², v'_{m} ≈ 8.1 kg/cm².`,
key:['[[ΣL·t|A_{p}]] ≥ [[Z·U·S·N|56]]','σ_{m} ≤ 0.2f\'_{m}[1−([[h|35t]])^{2}]','V_{m} = 0.5v\'_{m}αtL + 0.23P_{g}'],
err:'Contar muros con menos de 1.2 m o con ladrillo pandereta como muros portantes.',
x:[['esp','Comparte Z, U, S y sismo'],['car','P_{g} viene del metrado'],['dri','Deriva límite 0.005']],
g:[
r=>{const Z=r.p([.45,.35,.25]),S=r.p([1,1.05,1.1,1.2]),N=r.i(2,5);return{q:`Vivienda (U=1) con Z=${Z}, S=${S} y ${N} pisos. Halla la densidad mínima ZUSN/56.`,a:Z*S*N/56,u:'',tol:.01,s:[`= ${Z}·1·${S}·${N}/56 = ${n(Z*S*N/56)}`]};},
r=>{const fm=r.i(30,110,5);return{q:`Con f'_{m}=${fm} kg/cm², ¿cuál es el límite 0.15f'_{m}?`,a:.15*fm,u:'kg/cm²',s:[`= ${n(.15*fm)} kg/cm²`]};},
r=>{const fm=r.p([35,45,55,65,85]),h=r.i(2.3,3,.1),t=r.p([13,23]);const s=.2*fm*(1-(h*100/(35*t))**2);return{q:`Muro h=${h} m, t=${t} cm, f'_{m}=${fm}. Halla el esfuerzo admisible por esbeltez.`,a:s,u:'kg/cm²',s:[`(h/35t)² = ${n((h*100/(35*t))**2)}`,`σ = ${n(s)} kg/cm²`]};},
r=>{const vm=r.p([5.1,8.1,9.2]),L=r.i(2,6,.5),t=r.p([13,23]),P=r.i(5,25);const V=.5*vm*t*L*100/1000+.23*P;return{q:`Muro L=${L} m, t=${t} cm, v'_{m}=${vm}, P_{g}=${P} t, α=1. Halla V_{m}.`,a:V,u:'t',s:[`Término 1: ${n(.5*vm*t*L*100/1000)} t`,`Término 2: ${n(.23*P)} t`,`V_{m} = ${n(V)} t`]};},
r=>{const Z=r.p([.45,.35]),S=r.p([1,1.05,1.15]),N=r.i(2,5),A=r.i(60,150,10),t=.13;const req=Z*S*N/56*A/t;return{q:`Vivienda de ${N} pisos, planta ${A} m², Z=${Z}, S=${S}, U=1, muros t=13 cm. ¿Cuántos metros de muro por dirección se requieren?`,a:req,u:'m',s:[`Densidad = ${n(Z*S*N/56)}`,`ΣL = densidad·A/t = ${n(req)} m`]};}
]});

SUB('gdl',{t:'Sistema de un grado de libertad',
lec:`Modela un edificio como una masa sobre un resorte y un amortiguador:

mü + cu̇ + ku = −m·a_{suelo}

El **amortiguamiento** ζ apaga la vibración; en concreto, cerca de 5 %. Se mide con el decremento logarítmico: comparas dos picos sucesivos.

El **espectro de respuesta** resume cómo responden distintos periodos ante un sismo: dado T, te da la aceleración S_{a}. Con eso, el desplazamiento es S_{d} = S_{a}/ω².`,
key:['ζ = [[c|2mω]]','δ = ln[[u_{1}|u_{2}]] ≈ 2πζ','ω_{d} = ω√{1−ζ^{2}}','S_{d} = [[S_{a}|ω^{2}]]'],
err:'Olvidar que un 5 % de amortiguamiento no cambia casi el periodo, pero sí mucho la amplitud.',
x:[['osc','Es la oscilación libre con amortiguador'],['esp','El espectro da las fuerzas de diseño'],['edo','Es una ecuación diferencial de 2.° orden']],
g:[
r=>{const c=r.i(20,200,10),m=r.i(50,300,10),w=r.i(5,30);return{q:`m=${m} t, ω=${w} rad/s, c=${c} kN·s/m. Halla ζ.`,a:c/(2*m*w)*100,u:'%',s:[`ζ = c/(2mω) = ${n(c/(2*m*w)*100)} %`]};},
r=>{const w=r.i(5,30,1),z=r.p([.02,.05,.1,.2]);return{q:`ω=${w} rad/s, ζ=${z*100} %. Halla ω_{d}.`,a:w*sq(1-z*z),u:'rad/s',tol:.002,s:[`ω_{d} = ${w}·√(1−${z}²) = ${n(w*sq(1-z*z),5)}`]};},
r=>{const u1=r.i(5,30),f=r.i(60,90,5);const d=Math.log(100/f),z=d/(2*PI);return{q:`Picos sucesivos: ${u1} mm y ${n(u1*f/100)} mm. Estima ζ.`,a:z*100,u:'%',s:[`δ = ln(u₁/u₂) = ${n(d)}`,`ζ ≈ δ/2π = ${n(z*100)} %`]};},
r=>{const Sa=r.i(.1,1.2,.05),T=r.i(.2,2,.1);const w=2*PI/T;return{q:`S_{a}=${Sa}g y T=${T} s. Halla S_{d}.`,a:Sa*G/w/w*1000,u:'mm',s:[`ω = ${n(w)} rad/s`,`S_{d} = S_{a}/ω² = ${n(Sa*G/w/w*1000)} mm`]};},
r=>{const m=r.i(100,800,50),k=r.i(5000,60000,5000),Sa=r.p([.2,.3,.4,.5]);const w=sq(k/m),T=2*PI/w,V=m*Sa*G,d=V/k*1000;return{q:`m=${m} t, k=${k} kN/m, S_{a}=${Sa}g. Halla el desplazamiento máximo.`,a:d,u:'mm',s:[`T = ${n(T)} s`,`V = m·S_{a} = ${n(V)} kN`,`u = V/k = ${n(d)} mm`]};}
]});
SUB('esp',{t:'Cortante basal (E.030)',
lec:`La norma condensa toda la dinámica en una fórmula: **V = (Z·U·C·S/R)·P**.

- **Z:** zona. Z4=0.45, Z3=0.35, Z2=0.25, Z1=0.10. Toda Lima y Callao están en zona 4.
- **U:** uso. A esencial=1.5, B importante=1.3, C común=1.0.
- **S:** suelo. Lo da el estudio de suelos con T_{P} y T_{L}.
- **C:** amplificación según T.
- **R:** reducción por ductilidad. R₀: pórticos 8, dual 7, muros 6, albañilería 3, muros de ductilidad limitada 3.5.

## Novedades de la E.030 de 2026
- Los perfiles de suelo se clasifican por V_{s30} y los valores intermedios de S, T_{P} y T_{L} se **interpolan**.
- Se aplica sismo simultáneo: 100 % en una dirección y 30 % en la otra.
- El periodo del terreno T_{s} es obligatorio para categorías A y B en zona 4.
- Muros de ductilidad limitada: R₀ = 3.5 y deriva 0.004.

**Importante:** los ejercicios entregan S, T_{P} y T_{L} como datos. En un proyecto real toma siempre los valores del texto oficial vigente y el régimen de transición de la R.M. 217-2026.`,

SUB('dis',{t:'Fuerzas por piso',
lec:`El cortante basal se reparte en altura. La fuerza es mayor arriba porque ahí el edificio se mueve más.

F_{i} = α_{i}·V, con α_{i} = P_{i}·h_{i}^{k}/Σ(P_{j}·h_{j}^{k})

- T ≤ 0.5 s: k = 1
- T > 0.5 s: k = 0.75 + 0.5T (máximo 2)

**Cortante de piso:** suma de las fuerzas de arriba. **Momento de volteo:** Σ F_{i}·h_{i}. El volteo llega a la cimentación.

**Excentricidad accidental:** 5 % de la dimensión en planta, para considerar torsión imprevista.`,

SUB('dri',{t:'Derivas de entrepiso',
lec:`Un edificio flexible rompe tabiques y golpea al vecino. Por eso se limita la **deriva**: desplazamiento relativo dividido entre altura de piso.

- Regular: Δ = 0.75·R·Δ_{elástico}
- Irregular: Δ = 0.85·R·Δ_{elástico}

- Concreto armado: 0.007
- Acero: 0.010
- Albañilería: 0.005
- Madera: 0.010
- Muros de ductilidad limitada: 0.004

Muchas veces **la deriva gobierna** el diseño y por eso se agregan muros.`,

SUB('fas',{t:'Relaciones de fases',
lec:`El suelo tiene tres fases: **sólidos, agua y aire**. Casi todo lo que quieres saber se obtiene de sus proporciones.

- **Relación de vacíos:** e = V_{v}/V_{s}
- **Porosidad:** n = V_{v}/V, y n = e/(1+e)
- **Humedad:** w = W_{w}/W_{s}
- **Saturación:** S = V_{w}/V_{v}

## La relación clave
**S·e = w·G_{s}**. G_{s} ronda 2.65.

**Imagen:** una bolsa llena de canicas. El espacio entre canicas son los vacíos. Si los llenas de agua, está saturado.`,

err:'Confundir e (se divide por sólidos) con n (se divide por el total).',
x:[['efe','El peso unitario da el esfuerzo'],['cpt','γ_{d} mide compactación'],['agr','Misma idea de humedad en agregados']],
g:[
r=>{const e=r.i(.3,1.2,.05);return{q:`e=${e}. Halla n.`,a:e/(1+e),u:'',s:[`n = e/(1+e) = ${n(e/(1+e))}`]};},

r=>{const G=r.p([2.6,2.65,2.7]),e=r.i(.4,1.1,.05);return{q:`Suelo saturado: G_{s}=${G}, e=${e}. Halla γ_{sat}.`,a:(G+e)/(1+e),u:'t/m³',s:[`γ_{sat} = (G_{s}+e)/(1+e) = ${n((G+e)/(1+e))} t/m³`]};},

]});
SUB('cla',{t:'Clasificación de suelos',
lec:`Dos suelos con el mismo nombre deben comportarse igual. Para eso existe **SUCS**. Se basa en dos cosas:

**Granulometría:** ¿cuánto pasa la malla N.° 200 (0.075 mm)? Más de 50 %: grueso retenido o fino.

- Grava bien gradada: C_{u} ≥ 4, 1≤C_{c}≤3. Arena bien gradada: C_{u} ≥ 6, 1≤C_{c}≤3

SUB('cpt',{t:'Compactación',
lec:`Compactar es sacar el aire golpeando el suelo, para que resista más y se asiente menos.

**Proctor:** se compacta con distintas humedades y se grafica γ_{d} contra w. Aparece un pico: **humedad óptima y densidad máxima**. Con poca agua, las partículas no se acomodan. Con mucha, el agua ocupa su lugar.

**En obra:** se verifica con el cono de arena. El **grado de compactación** debe ser ≥ 95 % generalmente.

En vías y rellenos, esta es la diferencia entre durar 20 años o un invierno.`,

SUB('efe',{t:'Esfuerzos efectivos',
lec:`Terzaghi descubrió el principio más importante de la geotecnia:

**σ′ = σ − u**

El suelo lo sostienen sus partículas (σ′), no el agua. Si la presión del agua sube, las partículas se separan y el suelo pierde resistencia.

**Licuación:** en un sismo, una arena saturada sube u hasta igualar σ. Entonces σ′=0 y el suelo se comporta como un líquido. Pasó en Chimbote (1970) y en Pisco (2007).

Bajo el nivel freático usa γ′ = γ_{sat} − γ_{w}.`,

SUB('flu',{t:'Flujo de agua en suelos',
lec:`El agua atraviesa el suelo. **Darcy** dijo que la velocidad es proporcional al gradiente: v = k·i, donde k es la permeabilidad.

Valores típicos de k (cm/s): grava 1, arena 10⁻², limo 10⁻⁵, arcilla 10⁻⁷. Hay un rango enorme.

SUB('cns',{t:'Consolidación y asentamientos',
lec:`Al cargar arcilla saturada, el agua debe salir por poros diminutos antes de que el suelo se comprima. Puede tardar **décadas**. La Torre de Pisa se inclinó por este proceso.

## Cuánto
Para arcilla normalmente consolidada:

S = [C_{c}·H/(1+e_{0})]·log[(σ₀′+Δσ)/σ₀′]

## Cuándo
t = T_{v}·H_{d}²/c_{v}. H_{d} es la mitad del estrato si drena por ambos lados. Para U=50 %, T_{v}=0.197; U=90 %, T_{v}=0.848.

**Precarga y drenes:** técnicas para adelantar el asentamiento antes de construir.`,

err:'Usar el estrato completo como H_{d} con doble drenaje. Es la mitad.',

g:[

r=>{const Cc=r.i(.2,.8,.05),H=r.i(2,10),e=r.i(.7,1.3,.05),s0=r.i(5,20),d=r.i(2,15);return{q:`Arcilla NC: C_{c}=${Cc}, H=${H} m, e₀=${e}, σ₀′=${s0}, Δσ=${d} t/m². Halla S.`,a:Cc*H/(1+e)*Math.log10((s0+d)/s0)*100,u:'cm',s:[`S = ${n(Cc*H/(1+e))} log(${n((s0+d)/s0)})`,`S = ${n(Cc*H/(1+e)*Math.log10((s0+d)/s0)*100)} cm`]};},

SUB('res',{t:'Resistencia al corte',
lec:`El suelo falla por cortante, deslizándose. El criterio de **Mohr-Coulomb** lo resume:

τ = c′ + σ′·tan φ′

- **c:** cohesión, como si los granos tuvieran goma
- **φ:** fricción interna, como la de un montón de arena

## Ensayos
- **Corte directo:** simple y barato
- **Triaxial:** controla el drenaje. Da resultados más fiables

## Condiciones
Arcillas cargadas rápido: no drenado, φ=0, c=c_{u}. Arenas: drenadas, c=0.

El plano de falla forma 45° + φ/2 con el plano principal mayor.`,
key:['τ = c + σ′·tan φ','σ_{1} = σ_{3}·tan^{2}(45+φ/2) + 2c·tan(45+φ/2)','θ = 45° + [[φ|2]]'],
err:'Usar c en arena suelta o φ en arcilla blanda sin drenar.',
x:[['moh','Usa el círculo de Mohr'],['fri','φ es fricción'],['cap','Con c y φ se calcula la capacidad'],['emp','El empuje depende de φ']],
g:[
r=>{const c=r.i(0,5,.5),s=r.i(5,40),p=r.i(20,40);return{q:`c=${c} t/m², σ′=${s} t/m², φ=${p}°. Halla τ.`,a:c+s*tand(p),u:'t/m²',s:[`τ = ${c} + ${s} tan ${p}° = ${n(c+s*tand(p))}`]};},
r=>{const p=r.i(0,44,2);return{q:`φ=${p}°. ¿Qué ángulo forma el plano de falla?`,a:45+p/2,u:'°',s:[`θ = 45 + ${p/2} = ${45+p/2}°`]};},
r=>{const s3=r.i(5,30),p=r.i(25,40);const a=s3*tand(45+p/2)**2;return{q:`Arena (c=0), σ₃=${s3} t/m², φ=${p}°. Halla σ₁ de falla.`,a,u:'t/m²',s:[`σ₁ = σ₃ tan²(45+φ/2) = ${n(a)}`]};},
r=>{const s1=r.i(10,30),t1=r.i(5,12),ds=r.i(10,30),p=r.i(20,38);const t2=t1+ds*tand(p);return{q:`Corte directo: con σ=${s1}, τ=${t1}; con σ=${s1+ds}, τ=${n(t2)} t/m². Halla φ.`,a:p,u:'°',s:[`tan φ = Δτ/Δσ = ${n((t2-t1)/ds)}`,`φ = ${p}°`]};},
r=>{const s3=r.i(5,25),dev=r.i(10,40);return{q:`Triaxial no drenado en arcilla: σ₃=${s3}, esfuerzo desviador en falla=${dev} t/m². Halla c_{u}.`,a:dev/2,u:'t/m²',s:[`c_{u} = (σ₁−σ₃)/2 = ${dev/2}`,`Es el radio del círculo de Mohr`]};}
]});

SUB('cap',{t:'Capacidad portante',
lec:`¿Cuánta carga aguanta el suelo antes de fallar? Terzaghi dedujo una fórmula con tres aportes:

- **c·N_{c}:** cohesión
- **q·N_{q}:** el peso del suelo a los lados (profundidad)
- **½γ·B·N_{γ}:** el ancho y el peso bajo la zapata

La E.050 pide **FS = 3** para condiciones estáticas. Enterrar la zapata sube mucho la capacidad.

Factores para φ: 0→N_{c}=5.7, N_{q}=1, N_{γ}=0. 20°→17.7, 7.4, 5. 25°→25.1, 12.7, 9.7. 30°→37.2, 22.5, 19.7. 35°→57.8, 41.4, 42.4.

**Cuidado:** si el freático sube, γ baja a γ′ y la capacidad cae hasta la mitad.`,

SUB('zap',{t:'Diseño de zapatas',
lec:`La zapata reparte la carga de la columna en un área suficiente.

## Pasos
- **Área** con cargas de servicio: A = P/q_{a}
- **Punzonamiento:** la columna quiere atravesar la zapata. Se revisa a d/2 de la columna y suele definir el peralte
- **Cortante** a d de la cara
- **Flexión:** el suelo empuja hacia arriba, con voladizo en cada lado. El acero va **abajo**

## Presión última
q_{u} = P_{u}/A. Para flexión con volado m: M_{u} = q_{u}·B·m²/2.

Para punzonamiento: V_{c} = 1.06√f'_{c}·b_{o}·d (φ=0.85).`,
