<title>Civil Desde Cero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Concepto: una elevación de edificio que se llena con el avance; hojas de cálculo cuadriculadas para practicar */
:root{--bg:#EDEEEA;--sf:#F8F8F5;--sf2:#E1E3DD;--fg:#1B2226;--mut:#566066;--line:#BFC4BD;--acc:#1746C7;--acc2:#F0B400;--acc-fg:#FFFFFF;--ok:#0F7A4D;--no:#B3261E;--okbg:#DDF1E6;--nobg:#FADFDB;--grid:rgba(23,70,199,.07);--dis:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;--tx:'Atkinson Hyperlegible',Verdana,system-ui,sans-serif;--mo:'JetBrains Mono',Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191C;--sf:#1C2327;--sf2:#283035;--fg:#ECEFEA;--mut:#A3ADB0;--line:#3C464B;--acc:#8CAAFF;--acc2:#F5C53A;--acc-fg:#10172B;--ok:#62D49D;--no:#FF9C93;--okbg:#14352A;--nobg:#42211E;--grid:rgba(140,170,255,.07);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14191C;--sf:#1C2327;--sf2:#283035;--fg:#ECEFEA;--mut:#A3ADB0;--line:#3C464B;--acc:#8CAAFF;--acc2:#F5C53A;--acc-fg:#10172B;--ok:#62D49D;--no:#FF9C93;--okbg:#14352A;--nobg:#42211E;--grid:rgba(140,170,255,.07);color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:17px/1.6 var(--tx);margin:0}
a{color:var(--acc)}:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--fg);color:var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--fg)}
.topin{max-width:1080px;margin:auto;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding-block:8px}
.marca{font:800 24px/1 var(--dis);letter-spacing:.02em;color:inherit;text-decoration:none;text-transform:uppercase}.marca i{font-style:normal;color:var(--acc2)}
.nav{display:flex;gap:4px;flex-wrap:wrap}.nav a{color:inherit;text-decoration:none;padding:4px 9px;font-size:15px;border-radius:2px}.nav a:hover{background:rgba(127,127,127,.28)}.nav a.on{background:var(--acc2);color:#17191A}
.busca{margin-left:auto;position:relative;flex:1 1 170px;max-width:280px;min-width:0}.busca input{width:100%;padding:5px 9px;border:1px solid transparent;background:rgba(127,127,127,.24);color:inherit;font:15px var(--tx);border-radius:2px}.busca input::placeholder{color:inherit;opacity:.72}
#res{position:absolute;top:100%;right:0;left:0;min-width:240px;background:var(--sf);color:var(--fg);border:1px solid var(--line);margin-top:4px;box-shadow:0 8px 24px rgba(0,0,0,.25)}#res a{display:block;padding:8px 10px;text-decoration:none;color:var(--fg);border-bottom:1px solid var(--line)}#res a:hover{background:var(--sf2)}#res small{display:block;color:var(--mut)}#res p{margin:0;padding:10px}
main{max-width:1080px;margin:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 64px;display:grid;gap:34px}main>*{min-width:0}section{min-width:0}
h1,.h1{font:800 clamp(32px,6.4vw,70px)/.98 var(--dis);margin:0 0 12px;text-wrap:balance;overflow-wrap:break-word;hyphens:auto;text-transform:uppercase;letter-spacing:.005em}.h2,h2{font:800 clamp(26px,3.6vw,36px)/1.05 var(--dis);margin:0 0 10px;text-transform:uppercase;letter-spacing:.01em}h3{font:700 19px/1.3 var(--tx);margin:18px 0 6px}
.eyebrow{font:600 12px var(--mo);letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:0 0 8px}.lead{font-size:20px;max-width:64ch;margin:0 0 16px}.muted{color:var(--mut)}
.prosa{max-width:68ch}.prosa p,.prosa ul{margin:0 0 13px}.prosa ul{padding-left:22px}.prosa li{margin-bottom:4px}
.hero{border-bottom:3px solid var(--fg);padding-bottom:22px}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 14px;border:2px solid var(--fg);background:transparent;color:var(--fg);font:700 16px var(--tx);text-decoration:none;cursor:pointer;border-radius:2px;text-align:center;line-height:1.25;min-width:0}.btn:hover{background:var(--sf2)}.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}.btn.pri:hover{filter:brightness(1.1);background:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0;max-width:640px}.stats dt{font:600 11px var(--mo);letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}.stats dd{margin:0;font:800 32px/1 var(--dis);font-variant-numeric:tabular-nums}
.edificio{margin-top:12px;display:flex;flex-direction:column-reverse;gap:0;border:3px solid var(--fg);background:var(--sf);position:relative}
.techo{order:-1;display:none}.suelo{order:-1;background:var(--fg);color:var(--bg);padding:5px 12px;font:600 12px var(--mo);letter-spacing:.09em;text-transform:uppercase}
.piso{display:grid;grid-template-columns:118px minmax(0,1fr);border-top:3px solid var(--fg)}.piso:last-of-type{border-top:0}.pisot{font:800 18px/1.05 var(--dis);text-transform:uppercase;padding:10px;background:var(--sf2);display:flex;align-items:center;min-width:0}
.vent{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;padding:9px;min-width:0}
.ven{--p:0%;display:block;padding:10px;color:var(--fg);text-decoration:none;border:2px solid var(--fg);background:linear-gradient(to top,var(--acc2) var(--p),var(--sf) var(--p));transition:transform .12s;min-width:0}.ven:hover{transform:translateY(-2px)}.vn{display:block;font-weight:700;line-height:1.25}.vp{display:block;font:12px var(--mo);margin-top:3px;background:var(--sf);width:fit-content;padding:0 3px;color:var(--fg)}
.como ol{padding-left:22px;margin:0;display:grid;gap:6px;max-width:70ch}
.miga{font-size:15px;color:var(--mut)}
.barra{height:10px;background:var(--sf2);border:1px solid var(--line);max-width:520px}.barra span{display:block;height:100%;background:var(--acc)}.barra.fina{height:5px;margin-top:6px;display:block;max-width:none}
.lista{list-style:none;padding:0;margin:18px 0;display:grid;gap:7px}.lista a{display:block;padding:11px 13px;background:var(--sf);border:1px solid var(--line);color:var(--fg);text-decoration:none}.lista a:hover{border-color:var(--acc)}.ln1{display:flex;justify-content:space-between;gap:10px;font-weight:700}.tag{font:12px var(--mo);font-variant-numeric:tabular-nums;flex:none}
.refs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:20px;border-top:1px solid var(--line);margin-top:20px}.refs ul{padding-left:20px;margin:0}
.leccion{display:grid;gap:22px;min-width:0}.leccion>*{min-width:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.2}.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 3px}.fr>span:last-child{padding:0 3px}.rad{border-top:1px solid currentColor;padding:0 2px}sub,sup{font-size:.72em;line-height:0}
.formulas{background:var(--fg);color:var(--bg);padding:15px 18px;max-width:760px}.formulas h2{font-size:21px;color:var(--acc2)}.formulas ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px 22px}.formulas li{font:15px/1.8 var(--mo);overflow-wrap:anywhere}
.fig{margin:0;max-width:440px;background:var(--sf);border:1px solid var(--line);padding:10px}.fig svg{width:100%;height:auto;display:block}.fig figcaption{font-size:14px;color:var(--mut);margin-top:6px}
svg text{font:12px var(--mo);fill:var(--fg)}svg .ln{fill:none;stroke:var(--fg);stroke-width:2}svg .th{stroke-width:1;stroke-dasharray:4 3;fill:none}svg .ac{fill:none;stroke:var(--acc);stroke-width:2.5}svg .ac2l{fill:none;stroke:var(--no);stroke-width:2.5}svg .fl{fill:var(--sf2);stroke:var(--fg);stroke-width:1.5}svg .fl2{fill:var(--acc);opacity:.3}svg .ha{fill:var(--acc2);opacity:.55}svg .ac2{fill:var(--acc)}svg .pt{fill:var(--acc2);stroke:var(--fg)}
.lab{border:2px solid var(--acc);padding:15px;background:var(--sf);max-width:760px}.lab h2{font-size:22px}.labctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px 16px;margin-bottom:10px}.labctl label{grid-row:1;font-size:14px}.labctl input{grid-row:2;width:100%;accent-color:var(--acc)}.lab svg{max-width:100%;width:520px;height:auto;display:block}.labres{margin:8px 0 0}
@media(max-width:620px){.labctl{grid-template-columns:1fr}.labctl label,.labctl input{grid-row:auto}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.piso{grid-template-columns:minmax(0,1fr)}.pisot{padding:7px 10px}.vent{grid-template-columns:minmax(0,1fr)}}
.ejemplos{display:grid;gap:8px;max-width:760px}details{background:var(--sf);border:1px solid var(--line);padding:10px 14px}summary{font-weight:700;cursor:pointer}
.pasos{padding-left:22px;margin:8px 0;font-size:16px}.pasos li{margin-bottom:6px;overflow-wrap:anywhere}.final{margin:6px 0;font-family:var(--mo);font-size:15px;font-variant-numeric:tabular-nums}.enun{margin:6px 0 10px;overflow-wrap:anywhere}
.ded{max-width:760px;border-top:3px solid var(--fg);padding-top:6px}.ded .prosa h3{margin-top:18px}.cri{max-width:760px}.pc{background:var(--sf);border:1px solid var(--line);padding:12px 15px;margin:0 0 10px}.pc .enun{margin:0 0 8px}.ops{display:grid;gap:6px}.op{text-align:left;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);padding:9px 12px;cursor:pointer;overflow-wrap:anywhere}.op:hover:not([disabled]){border-color:var(--fg)}.op[disabled]{cursor:default}.op.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok)}.op.no{background:var(--nobg);color:var(--no);border-color:var(--no)}.btn.chico{padding:5px 10px;font-size:13px}.refsub{max-width:760px;padding:10px 15px;border:1px solid var(--line)}.refsub h2{font-size:18px;margin-bottom:4px}.refsub ul{margin:0;padding-left:18px}
.error{max-width:760px;padding:11px 15px;background:var(--nobg);border-left:0;outline:1px solid var(--no)}.error h2{font-size:18px;color:var(--no);margin-bottom:2px}.error p{margin:0}
.plist{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px 22px}.plist a{font-weight:700;display:block}.plist span{font-size:15px;color:var(--mut)}
.niveles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:12px 0}.niv{padding:7px 4px;border:2px solid var(--line);background:var(--sf);color:var(--fg);cursor:pointer;font:700 14px var(--tx);min-width:0;overflow-wrap:anywhere;line-height:1.2}.niv small{display:block;font:11px var(--mo);font-variant-numeric:tabular-nums;margin-top:2px}.niv.on{border-color:var(--acc);background:var(--acc);color:var(--acc-fg)}
@media(max-width:520px){.niveles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rejilla{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}.cel{width:38px;height:34px;border:1px solid var(--line);background:var(--sf);color:var(--fg);font:12px var(--mo);cursor:pointer;font-variant-numeric:tabular-nums}.cel.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}.cel.no{background:var(--nobg);border-color:var(--no);color:var(--no)}.cel.act{outline:2px solid var(--acc);outline-offset:1px}
.hoja{background-color:var(--sf);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border:2px solid var(--fg);padding:15px;max-width:760px;margin-top:6px}.hojah{display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;font:600 12px var(--mo);letter-spacing:.05em;text-transform:uppercase;color:var(--mut);padding-bottom:7px;border-bottom:1px solid var(--line)}.hoja .enun{font-size:18px}
.pill{padding:1px 7px;font-size:11px}.pill.ok{background:var(--okbg);color:var(--ok)}.pill.no{background:var(--nobg);color:var(--no)}
.resp label{display:block;font-size:14px;color:var(--mut);margin-bottom:3px}.fila{display:flex;flex-wrap:wrap;gap:7px}.fila input{flex:1 1 130px;min-width:0;padding:8px 10px;border:2px solid var(--fg);background:var(--bg);color:var(--fg);font:16px var(--mo);border-radius:2px}
.fb{padding:8px 11px;margin:10px 0 6px;background:var(--sf2)}.fb.ok{background:var(--okbg);color:var(--ok)}.fb.no{background:var(--nobg);color:var(--no)}
.pasar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;border-top:3px solid var(--fg);padding-top:14px}
.hilos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin-top:18px}.hilo{background:var(--sf);border:1px solid var(--line);padding:13px 16px;min-width:0}.hilo h3{margin:0;font:800 24px/1.1 var(--dis);text-transform:uppercase}.hilo p{margin:3px 0 8px}.cad{list-style:none;padding:0;margin:0;counter-reset:c}.cad li{counter-increment:c;position:relative;padding:3px 0 3px 30px}.cad li::before{content:counter(c);position:absolute;left:0;top:5px;width:22px;height:22px;display:grid;place-items:center;background:var(--acc2);color:#17191A;font:600 11px var(--mo)}.cad li:not(:last-child)::after{content:"";position:absolute;left:10px;top:27px;bottom:-5px;width:2px;background:var(--line)}
.center{text-align:center;display:grid;justify-items:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
